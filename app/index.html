function FinancesPage({ctx}){
  const {clients,derived,settings,travel}=ctx;
  const [year,setYear]=useState(new Date().getFullYear());
  const [calc,setCalc]=useState('');
  const months=useMemo(()=>finance(derived,clients,settings,year),[derived,clients,settings,year]);
  const mi=mileage(travel,settings,year);
  const T=k=>sum(months,m=>m[k]);
  const now=new Date();const curM=year===now.getFullYear()?now.getMonth():-1;
  const r=(Number(settings.gstRate)||0)/100,tr=(Number(settings.taxRate)||0)/100;
  const a=Number(calc)||0;const g=settings.gstRegistered?a*r/(1+r):0;const t=(a-g)*tr;
  // chart
  const W=ctx.isM?400:1100,H=ctx.isM?250:300,P={l:ctx.isM?38:52,r:6,t:14,b:28};
  const vals=months.map(m=>({keep:m.spreadKeep,tax:m.spreadTax,gst:m.spreadGst,proj:m.proj}));
  const maxV=Math.max(100,...vals.map(v=>v.keep+v.tax+v.gst+v.proj));
  const step=niceStep(maxV/4);const top=Math.ceil(maxV/step)*step;
  const y=v=>P.t+(H-P.t-P.b)*(1-v/top);const bw=(W-P.l-P.r)/12;
  const recent=derived.segments.slice().sort((x,z)=>x.date<z.date?1:-1).slice(0,12);
  return html`<div>
    <div class="page-h"><div><div class="eyebrow">Set aside first, pay yourself second</div><h1>Finances</h1></div><span class="sp"></span>
      <div class="seg">${[year-1,year,year+1].map(yv=>html`<button aria-pressed=${yv===year} onClick=${()=>setYear(yv)}>${yv}</button>`)}</div></div>
    <div class="stats">
      <div class="stat"><span class="l">Collected ${year}</span><span class="v num">${money0(T('collected'))}</span><span class="s">cash actually received</span></div>
      <div class="stat"><span class="l">GST to remit</span><span class="v num">${money0(T('gst'))}</span><span class="s">${settings.gstRegistered?`${settings.gstRate}% collected`:'Not registered'}</span></div>
      <div class="stat"><span class="l">Tax set-aside</span><span class="v num">${money0(T('tax'))}</span><span class="s">${settings.taxRate}% of net</span></div>
      <div class="stat"><span class="l">Yours to keep</span><span class="v num">${money0(T('keep'))}</span><span class="s">after GST & tax</span></div>
      <div class="stat"><span class="l">Driving</span><span class="v num">${Math.round(mi.km).toLocaleString()} km</span><span class="s">≈ ${money0(mi.ded)} at your per-km rates</span></div>
    </div>
    <div class="two" style="margin-bottom:16px">
      <div class="panel"><div class="panel-h"><h3>Money just came in</h3></div><div class="panel-b" style="display:flex;flex-direction:column;gap:10px">
        <${Field} label="Amount received"><input type="number" min="0" step="0.01" value=${calc} placeholder="e.g. 520" onInput=${e=>setCalc(e.target.value)}/><//>
        <dl class="kv"><dt>GST portion</dt><dd class="num">${money(g)}</dd><dt>Income tax set-aside</dt><dd class="num">${money(t)}</dd><dt>Pay yourself</dt><dd class="num"><b>${money(a-g-t)}</b></dd></dl>
        <span class="fhint">Move the GST and tax amounts to a separate savings account the day the money lands.</span></div></div>
      <div class="panel"><div class="panel-h"><h3>Recent payments</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Athlete</th><th class="r">Received</th><th class="r">GST</th><th class="r">Tax</th><th class="r">Keep</th></tr></thead><tbody>
        ${recent.length?recent.map(sg=>{const fl=sg.charge?!!sg.charge.gst:!!settings.gstIncluded;const gg=gstShare(sg.amount,fl,settings);const tt=(sg.amount-gg)*tr;
          return html`<tr><td>${fmtDate(sg.date,{month:'short',day:'numeric'})}</td><td>${sg.client.name}</td><td class="r num">${money(sg.amount)}</td><td class="r num">${money(gg)}</td><td class="r num">${money(tt)}</td><td class="r num"><b>${money(sg.amount-gg-tt)}</b></td></tr>`})
          :html`<tr><td colspan="6"><div class="empty">No payments yet.</div></td></tr>`}</tbody></table></div></div>
    </div>
    <div class="panel chart"><div class="panel-h"><h3>Monthly paycheck · ${year}</h3><span class="sp"></span><span class="fhint">Multi-month payments are spread across the months they cover.</span></div>
      <div class="tbl-wrap"><svg viewBox=${`0 0 ${W} ${H}`} role="img" aria-label=${'Smoothed monthly income for '+year} style=${ctx.isM?'':'min-width:560px'}>
        ${Array.from({length:Math.round(top/step)+1},(_,i)=>{const v=i*step;return html`<g><line x1=${P.l} x2=${W-P.r} y1=${y(v)} y2=${y(v)} style="stroke:var(--line);stroke-width:1"/><text x=${P.l-8} y=${y(v)+4} text-anchor="end" font-size="11" style="fill:var(--muted);font-family:var(--f-mono)">${v>=1000?(v/1000)+'k':v}</text></g>`})}
        <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:var(--surface)"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--muted);stroke-width:2"/></pattern></defs>
        ${vals.map((v,i)=>{const x=P.l+i*bw+bw*.18,w=bw*.64;let base=0;const seg=(val,fill)=>{if(val<=0)return null;const y1=y(base+val),y0=y(base);base+=val;return html`<rect x=${x} y=${y1} width=${w} height=${Math.max(0,y0-y1)} style=${'fill:'+fill}/>`};
          return html`<g>${seg(v.keep,'var(--fg)')}${seg(v.tax,'var(--o)')}${seg(v.gst,'var(--y)')}${v.proj>0?(()=>{const y1=y(base+v.proj),y0=y(base);base+=v.proj;return html`<rect x=${x} y=${y1} width=${w} height=${Math.max(0,y0-y1)} style="fill:url(#hatch);stroke:var(--muted);stroke-width:1"/>`})():null}
            <text x=${x+w/2} y=${H-10} text-anchor="middle" font-size="11.5" style=${`fill:${i===curM?'var(--accent)':'var(--muted)'};font-weight:${i===curM?700:500};font-family:var(--f-body)`}>${ctx.isM?MONTHS[i][0]:MONTHS[i]}</text></g>`})}
      </svg></div>
      <div class="chart-legend"><span><i style="background:var(--fg)"></i>Take-home</span><span><i style="background:var(--o)"></i>Income tax set-aside</span><span><i style="background:var(--y)"></i>GST</span><span><i style="background:repeating-linear-gradient(45deg,var(--muted) 0 2px,var(--surface) 2px 5px)"></i>Projected from active plans</span></div>
    </div>
    <div class="panel tbl-wrap" style="margin-top:16px"><table class="tbl"><thead><tr><th>Month</th><th class="r">Collected</th><th class="r">GST</th><th class="r">Tax set-aside</th><th class="r">Smoothed income</th><th class="r">Smoothed paycheck</th><th class="r">Projected extra</th></tr></thead><tbody>
      ${months.map((m,i)=>html`<tr style=${i===curM?'font-weight:700':''}><td>${MONTHS[i]}</td><td class="r num">${money0(m.collected)}</td><td class="r num">${money0(m.gst)}</td><td class="r num">${money0(m.tax)}</td><td class="r num">${money0(m.spread)}</td><td class="r num">${money0(m.spreadKeep)}</td><td class="r num muted">${m.proj?money0(m.projKeep)+' take-home':'—'}</td></tr>`)}
      <tr style="font-weight:700"><td>Total</td><td class="r num">${money0(T('collected'))}</td><td class="r num">${money0(T('gst'))}</td><td class="r num">${money0(T('tax'))}</td><td class="r num">${money0(T('spread'))}</td><td class="r num">${money0(T('spreadKeep'))}</td><td class="r num muted">${money0(T('projKeep'))}</td></tr>
    </tbody></table></div>
    <div class="panel tbl-wrap" style="margin-top:16px"><div class="panel-h"><h3>Mileage log · ${year}</h3><span class="sp"></span><span class="fhint">Add travel from the car chip on any calendar day.</span></div>
      <table class="tbl"><thead><tr><th>Date</th><th>Where</th><th>Purpose</th><th class="r">km</th></tr></thead><tbody>
      ${mi.rows.length?mi.rows.map(t=>html`<tr><td>${fmtDate(t.date)}</td><td>${(t.stops||[]).map(id=>{const l=(settings.locations||[]).find(x=>x.id===id);return l?l.name:'?'}).join(', ')}${Number(t.extraKm)?` + ${t.extraKm} km extra`:''}</td><td class="muted">${t.note||'—'}</td><td class="r num">${Math.round(t.km)}</td></tr>`)
        :html`<tr><td colspan="4"><div class="empty">No trips logged for ${year}.</div></td></tr>`}</tbody></table></div>
    <p class="fhint" style="margin-top:14px">Estimates only, from the rates in Setup. Confirm your tax and GST numbers with your bookkeeper.</p>
  </div>`;
}
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}

const BK_COLS=['calendars','clients','events','ledger','travel'];
const BK_LABEL={calendars:'calendars',clients:'athletes',events:'calendar entries',ledger:'purchases & payments',travel:'travel days'};
function ImportBackup({api,ctx,compact}){
  const [bk,setBk]=useState(null);const [err,setErr]=useState('');const [mode,setMode]=useState('merge');const [prog,setProg]=useState(null);
  const fileRef=useRef(null);
  const pick=e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;setErr('');
    const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(String(r.result||''));
        if(!d||typeof d!=='object'||!d.settings||typeof d.settings!=='object'||!BK_COLS.some(c=>d[c]&&typeof d[c]==='object'))throw new Error('shape');
        const counts={};BK_COLS.forEach(c=>{counts[c]=d[c]&&typeof d[c]==='object'?Object.keys(d[c]).length:0});
        setBk({data:d,counts,name:f.name})}catch(_){setBk(null);setErr("That file isn't an SBD backup. Pick the .json file made by Download backup.")}};
    r.onerror=()=>setErr('Could not read that file. Try again.');r.readAsText(f)};
  const has=ctx?BK_COLS.some(c=>Object.keys(ctx[c]||{}).length):false;
  const run=async()=>{const d=bk.data;const total=BK_COLS.reduce((a,c)=>a+bk.counts[c],0);let done=0;setProg({done,total});
    try{
      if(ctx&&mode==='replace'){for(const c of BK_COLS){const keep=new Set(Object.keys(d[c]||{}));for(const id of Object.keys(ctx[c]||{})){if(!keep.has(id))await api.del(c,id)}}}
      for(const c of BK_COLS){for(const [id,doc] of Object.entries(d[c]||{})){if(!doc||typeof doc!=='object')continue;await api.put(c,id,{...doc,id});done++;if(done%10===0||done===total)setProg({done,total})}}
      await api.setSettings(d.settings);
      setProg(null);setBk(null);toast(`Backup imported · ${done} items`);
    }catch(_){setProg(null);toast('The import stopped partway. Try it again; items already imported are kept.')}};
  return html`<div class="imp">
    <input ref=${fileRef} type="file" accept=".json,application/json" hidden onChange=${pick}/>
    ${!bk&&html`<button class=${'btn'+(compact?'':'')} onClick=${()=>fileRef.current&&fileRef.current.click()}><${Icon} n="download" s=${16}/>${compact?'Import a backup':'Import backup (.json)'}</button>`}
    ${err&&html`<div class="callout u3">${err}</div>`}
    ${bk&&html`<div class="callout imp-box">
      <div><b>${bk.name}</b>${bk.data.exported?html` <span class="muted">· made ${fmtDateY(String(bk.data.exported).slice(0,10))}</span>`:''}</div>
      <div class="imp-counts">${BK_COLS.filter(c=>bk.counts[c]).map(c=>html`<span><b class="num">${bk.counts[c]}</b> ${BK_LABEL[c]}</span>`)}<span>plus settings, programs, baseline & training hours</span></div>
      ${has&&html`<div class="imp-modes">
        <label class="check"><input type="radio" name="impmode" checked=${mode==='merge'} onChange=${()=>setMode('merge')}/><span><b>Add & update</b> · keep what's here, add what's in the backup, overwrite matching items</span></label>
        <label class="check"><input type="radio" name="impmode" checked=${mode==='replace'} onChange=${()=>setMode('replace')}/><span><b>Replace everything</b> · make this app match the backup exactly (anything not in the backup is deleted)</span></label></div>`}
      ${prog?html`<div class="imp-prog"><div class="meter"><i style=${`width:${prog.total?Math.round(prog.done/prog.total*100):0}%`}></i></div><span class="fhint">Importing ${prog.done} of ${prog.total}… keep this page open.</span></div>`
        :html`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class=${'btn '+(mode==='replace'&&has?'danger':'primary')} onClick=${run}>${mode==='replace'&&has?'Replace with backup':'Import'}</button><button class="btn" onClick=${()=>setBk(null)}>Cancel</button></div>`}
    </div>`}
  </div>`;
}

const ROUTES=[['calendar','Calendar','cal'],['athletes','Athletes','users'],['payments','Payments','wallet'],['finances','Finances','chart'],['guides','Guides','book'],['setup','Setup','gear']];
function useLayout(){
  const mq=useMemo(()=>{try{return matchMedia('(max-width: 760px)')}catch(e){return null}},[]);
  const [pref,setPrefS]=useState(()=>ls.get('layout','auto'));
  const [narrow,setNarrow]=useState(()=>mq?mq.matches:false);
  useEffect(()=>{if(!mq)return;const f=e=>setNarrow(e.matches);
    try{mq.addEventListener('change',f)}catch(_){mq.addListener(f)}
    return()=>{try{mq.removeEventListener('change',f)}catch(_){mq.removeListener(f)}}},[]);
  const isM=pref==='phone'||(pref==='auto'&&narrow);
  useEffect(()=>{document.documentElement.classList.toggle('is-m',isM)},[isM]);
  return {isM,pref,setPref:v=>{ls.set('layout',v);setPrefS(v)}};
}
function App(){
  const store=useStore();
  const layout=useLayout();
  const theme=useTheme();const [themeOpen,setThemeOpen]=useState(false);

  useEffect(()=>{const f=()=>{const h=(location.hash||'').slice(1);if(ROUTES.some(r=>r[0]===h))setRoute(h)};addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);
  const settings=store.settings?{...DEFAULT_SETTINGS,...store.settings}:null;
  WPM=Number((settings||DEFAULT_SETTINGS).weeksPerMonth)||4;
  if(settings&&Array.isArray(settings.packages)&&settings.packages.length&&settings.packages.every(k=>!Number(k.price)&&['pkg-pt','pkg-online','pkg-junior'].includes(k.id)))settings.packages=DEFAULT_SETTINGS.packages;
  const derived=useMemo(()=>deriveAll({clients:store.clients,events:store.events,ledger:store.ledger,settings:settings||DEFAULT_SETTINGS}),[store.clients,store.events,store.ledger,store.settings]);
  const ctx={...store,settings,derived,isM:layout.isM,layout,theme};

  </div></header>`;
  let body;
  const live=store.ready&&settings&&store.mode!=='signedout';
  if(!store.ready)body=html`<div class="wrap" style="padding-block:60px"><div class="eyebrow">Loading your calendar, athletes and payments…</div></div>`;
  else if(store.mode==='signedout')body=html`<${SignIn} api=${store.api}/>`;
  else if(!settings)body=html`<${Onboarding} api=${store.api} mode=${store.mode}/>`;
  else body=html`<main class="wrap">
    ${route==='calendar'&&html`<${CalendarPage} ctx=${ctx}/>`}

    ${route==='payments'&&html`<${PaymentsPage} ctx=${ctx} openAthlete=${openAthlete}/>`}
    ${route==='finances'&&html`<${FinancesPage} ctx=${ctx}/>`}
    ${route==='guides'&&html`<${GuidesPage} ctx=${ctx}/>`}
    ${route==='setup'&&html`<${SetupPage} ctx=${ctx}/>`}
  </main>`;
  return html`<div class="shell">${band}${store.ready&&store.mode==='local'&&html`<div class="banner wrap">${store.auth==='offline'?'Can\'t reach the server right now. Check your internet connection and reload. Changes made now won\'t be kept.':'This view isn\'t connected to your account, so changes won\'t be kept. Open it in Claude while signed in.'}</div>`}${body}

    ${themeOpen&&html`<${Modal} title="Theme" wide onClose=${()=>setThemeOpen(false)} footer=${html`<span class="fhint">Saved on this device</span><span class="sp"></span><button class="btn primary" onClick=${()=>setThemeOpen(false)}>Done</button>`}><${ThemePicker} pref=${theme.pref} setPref=${theme.setPref}/><//>`}
    ${msg&&html`<div class="toast" role="status">${msg}</div>`}</div>`;
}
