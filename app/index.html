<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="SBD">
<meta name="theme-color" content="#0F0E0E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23E21E28'/%3E%3Ctext x='32' y='42' font-family='Arial Narrow,Arial' font-weight='900' font-size='26' text-anchor='middle' fill='white'%3ESBD%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>SBD Business Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: black brand band on top, working surface below; calendar = sidebar + time grid, athletes = list + profile. */
:root{
  --bg:#F2F1F1; --surface:#FFFFFF; --surface-2:#EBE9E9; --fg:#141213; --muted:#6B6566;
  --line:#DAD6D6; --line-2:#ECE9E9; --accent:#E21E28; --accent-ink:#FFFFFF;
  --band:#0F0E0E; --band-fg:#F4F1F1; --band-muted:#8E8787;
  --off:#E4E0E0; --ok:#2B9656; --y:#C99A00; --o:#E2700C; --r:#D7263D;
  --y-bg:#FFF4CC; --o-bg:#FFE6D1; --r-bg:#FFDDE1; --ok-bg:#DDF2E5;
  --shadow:0 18px 50px rgba(30,10,10,.20);
  --f-display:"Barlow Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --hour:52px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0C0C; --surface:#171515; --surface-2:#211E1E; --fg:#F2EFEF; --muted:#9C9595;
  --line:#2E2A2A; --line-2:#221F1F; --accent:#EE2E38; --accent-ink:#FFFFFF;
  --band:#050404; --band-fg:#F4F1F1; --band-muted:#8E8787;
  --off:#1B1818; --ok:#45C27A; --y:#EBC035; --o:#F59345; --r:#F2505D;
  --y-bg:#3A3110; --o-bg:#3D2410; --r-bg:#421619; --ok-bg:#12301F;
  --shadow:0 18px 50px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D0C0C; --surface:#171515; --surface-2:#211E1E; --fg:#F2EFEF; --muted:#9C9595;
  --line:#2E2A2A; --line-2:#221F1F; --accent:#EE2E38; --accent-ink:#FFFFFF;
  --band:#050404; --band-fg:#F4F1F1; --band-muted:#8E8787;
  --off:#1B1818; --ok:#45C27A; --y:#EBC035; --o:#F59345; --r:#F2505D;
  --y-bg:#3A3110; --o-bg:#3D2410; --r-bg:#421619; --ok-bg:#12301F;
  --shadow:0 18px 50px rgba(0,0,0,.6); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--band)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== Top band ===== */
.band{background:var(--band);color:var(--band-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
.band-in{display:flex;align-items:center;gap:20px;min-height:58px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.mark-sq{width:30px;height:30px;background:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.02em;color:#fff}
.mark-t{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.mark-t small{display:block;font-size:10.5px;letter-spacing:.22em;color:var(--band-muted);font-weight:700;margin-top:3px}
.nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav a{display:flex;align-items:center;gap:7px;padding:8px 12px;color:var(--band-muted);text-decoration:none;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--band-fg)}
.nav a[aria-current="page"]{color:var(--band-fg);border-bottom-color:var(--accent)}
.sync{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--band-muted);display:flex;align-items:center;gap:6px;font-weight:600}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.local i{background:var(--o)}
@media (max-width:760px){.nav{margin-left:0;width:100%;order:3}.nav a span{display:none}.nav a{padding:8px 10px}.band-in{gap:8px;padding-block:8px}}
@media (max-width:760px){.nav a span{display:inline}}

main{padding-block:18px 60px}
.page-h{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.page-h h1{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.02em;font-size:34px;line-height:1;margin:0;text-wrap:balance}
.page-h .sp{flex:1}
.eyebrow{font-family:var(--f-display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--muted)}

/* ===== Buttons & inputs ===== */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--r)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:6px;border:1px solid transparent;background:transparent}
.iconbtn:hover{background:var(--surface-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:600;font-size:13.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=tel],input[type=password],input:not([type]),select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;font-size:14.5px;min-width:0}
textarea{resize:vertical;min-height:72px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--fg)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.flabel{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fhint{font-size:12.5px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.fgrid .wide{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:16px;height:16px;accent-color:var(--accent)}

/* ===== Panels ===== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.panel-h h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.panel-h .sp{flex:1}
.panel-b{padding:14px}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px}

/* Stats strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .l{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .s{font-size:12.5px;color:var(--muted)}

/* Urgency pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.u0{background:var(--ok-bg);color:var(--ok)}
.u1{background:var(--y-bg);color:var(--y)}
.u2{background:var(--o-bg);color:var(--o)}
.u3{background:var(--r-bg);color:var(--r)}
.un{background:var(--surface-2);color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:4px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);color:var(--muted)}
.tag.ex{background:transparent;border:1px dashed var(--muted)}

/* Tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}

/* ===== Calendar ===== */
.cal{display:grid;grid-template-columns:232px minmax(0,1fr);gap:16px}
.cal-side{display:flex;flex-direction:column;gap:14px}
.cal-main{min-width:0;display:flex;flex-direction:column;gap:10px}
.cal-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-title{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.02em;line-height:1;margin:0 6px}
.cal-bar .sp{flex:1}
.callist{display:flex;flex-direction:column;gap:2px}
.calrow{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;user-select:none}
.calrow:hover{background:var(--surface-2)}
.calrow.hid{opacity:.45}
.calrow .sw{width:22px;height:22px;border-radius:5px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.calrow.hid .sw{background:transparent;border:2px solid var(--c);color:var(--c)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.lg-off{width:18px;height:12px;border:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--off) 0 4px,var(--surface) 4px 8px)}
.lg-open{width:18px;height:12px;border:1px solid var(--line);background:var(--surface)}
.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini-stats div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.mini-stats b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.1}
.mini-stats small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

.grid-shell{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.g-head{display:grid;border-bottom:1px solid var(--line);background:var(--surface)}
.g-head .gh{padding:8px 6px 6px;text-align:center;border-left:1px solid var(--line-2);min-width:0}
.gh .dn{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.gh .dd{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:50%}
.dbtn{border:0;background:transparent;cursor:pointer;color:inherit;padding:0}
.gh.today .dd.dbtn{background:var(--accent);color:#fff}
.dragging,.dragging *{user-select:none!important;-webkit-user-select:none!important;cursor:grabbing!important}
.gh .trav{margin-top:3px;display:flex;justify-content:center}
.travbtn{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:4px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.travbtn.on{border-style:solid;border-color:transparent;background:var(--surface-2);color:var(--fg)}
.g-body{overflow:auto;height:calc(100dvh - 250px);min-height:440px;position:relative}
.g-cols{display:grid;position:relative}
.g-gutter{position:relative;border-right:1px solid var(--line)}
.g-gutter span{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-50%);font-family:var(--f-mono)}
.g-col{position:relative;border-left:1px solid var(--line-2);background-image:linear-gradient(var(--line-2) 1px,transparent 1px),linear-gradient(var(--line-2) 1px,transparent 1px);background-size:100% var(--hour),100% var(--hour);cursor:cell;min-width:0}
.g-col.today{background-color:color-mix(in srgb,var(--accent) 3%,transparent)}
.off{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--off) 0 5px,transparent 5px 11px);pointer-events:none;border-top:1px solid var(--line-2)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}

.ev{position:absolute;border-radius:5px;padding:3px 6px 3px 5px;font-size:12px;line-height:1.25;overflow:hidden;cursor:grab;touch-action:manipulation;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;
  background:color-mix(in srgb,var(--c) 17%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 55%,transparent);color:var(--fg);z-index:2;display:flex;flex-direction:column;gap:1px}
.ev:hover{border-color:var(--c)}
.ev .t1{display:flex;align-items:center;gap:5px;font-weight:700;min-width:0}
.ev .t1 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .t2{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.ev .ch{flex:none;width:17px;height:17px;border-radius:4px;background:var(--c);color:#fff;display:grid;place-items:center}
.ev .sn{font-family:var(--f-mono);font-size:10.5px;font-weight:600;background:var(--surface);border-radius:3px;padding:0 4px;color:var(--fg)}
.ev.late,.ev.noshow{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--r) 20%,var(--surface)) 0 6px,var(--surface) 6px 12px);border-color:color-mix(in srgb,var(--r) 60%,transparent)}
.ev.late .ch,.ev.noshow .ch{background:var(--r)}
.ev.cancelled{opacity:.5}
.ev.cancelled .nm{text-decoration:line-through}
.ev .done-ck{flex:none;display:none;width:15px;height:15px;border-radius:50%;background:var(--ok);color:#fff;place-items:center}
.ev.done .done-ck{display:inline-grid}
.ev.drag{box-shadow:var(--shadow);z-index:20;opacity:.95;cursor:grabbing;outline:2px solid var(--c)}

.m-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.m-head div{padding:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.m-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(112px,auto)}
.m-cell{border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:4px;min-width:0;display:flex;flex-direction:column;gap:2px;cursor:cell}
.m-cell:nth-child(7n){border-right:0}
.m-cell.out{background:var(--bg)}
.m-cell.out .md{color:var(--muted)}
.m-top{display:flex;align-items:center;gap:4px;justify-content:space-between}
.md{font-family:var(--f-display);font-weight:800;font-size:17px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.m-cell.today .md.dbtn{background:var(--accent);color:#fff}
.m-ev{display:flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 4px;border-radius:4px;cursor:grab;touch-action:manipulation;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;white-space:nowrap;overflow:hidden;min-width:0}
.m-ev:hover{background:var(--surface-2)}
.m-ev .dot{flex:none;width:8px;height:8px;border-radius:2px;background:var(--c)}
.m-ev .tm{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.m-ev .nm{overflow:hidden;text-overflow:ellipsis;font-weight:600}
.m-ev.late .dot,.m-ev.noshow .dot{background:var(--r)}
.m-ev.cancelled{opacity:.5;text-decoration:line-through}
.m-ev.drag{background:var(--surface);box-shadow:var(--shadow);outline:2px solid var(--c)}
.m-more{font-size:11.5px;font-weight:700;color:var(--muted);background:none;border:0;text-align:left;padding:1px 4px}
.m-trav{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:3px}
.side-toggle{display:none}
@media (max-width:900px){
  .cal{grid-template-columns:minmax(0,1fr)}
  .cal-side{display:none}
  .cal-side.open{display:flex}
  .side-toggle{display:inline-flex}
  .m-grid{grid-auto-rows:minmax(78px,auto)}
  .m-ev .tm{display:none}
  .g-body{height:calc(100dvh - 290px)}
}

/* ===== Modal ===== */
.scrim{position:fixed;inset:0;background:rgba(5,3,3,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:12px;width:min(560px,100%);box-shadow:var(--shadow);display:flex;flex-direction:column;margin:auto 0;border:1px solid var(--line)}
.modal.wide{width:min(820px,100%)}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.mhead h2{margin:0;flex:1;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.03em;text-transform:uppercase}
.mbody{padding:16px;display:flex;flex-direction:column;gap:14px}
.mfoot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line-2);flex-wrap:wrap;align-items:center}
.mfoot .sp{flex:1}
.callout{border-radius:8px;padding:10px 12px;font-size:13.5px;background:var(--surface-2)}
.callout.u2{background:var(--o-bg);color:var(--fg)}
.callout.u3{background:var(--r-bg);color:var(--fg)}
.statusrow{display:flex;gap:6px;flex-wrap:wrap}
.statusrow button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.statusrow button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:6px;border:2px solid transparent;background:var(--c)}
.swatches button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--surface)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.icons button{height:38px;border:1px solid var(--line);border-radius:6px;background:var(--surface);display:grid;place-items:center}
.icons button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* ===== Athletes ===== */

/* ===== Charts ===== */

function useStore(){
  const [st,setSt]=useState({ready:false,mode:'loading',auth:null,user:null,settings:null,calendars:{},clients:{},events:{},ledger:{},travel:{}});
  const R=useRef({mode:'loading',root:null,q:{},uid:null,recent:{}});
  const [authTick,setAuthTick]=useState(0);
  useEffect(()=>{
    let unsubs=[],dead=false;
    (async()=>{
      /* ---- Inside Claude: artifact storage ---- */
      if(inClaude()){
        let db=null,uidv=null;
        try{db=await window.claude.use('db');const u=await window.claude.use('user');uidv=u?await u.id():null}catch(e){}
        if(dead)return;
        if(!db||!uidv){R.current.mode='local';setSt(s=>({...s,ready:true,mode:'local'}));return}
        const root=db.doc(`data/users/${uidv}/sbd`);
        R.current={...R.current,mode:'cloud',root};
        const pending=new Set(['settings',...COLS]);
        const done=k=>{if(pending.delete(k)&&pending.size===0)setSt(s=>({...s,ready:true}))};
        const onErr=e=>{toast(errMsg(e))};
        setSt(s=>({...s,mode:'cloud'}));
        unsubs.push(root.onSnapshot(snap=>{setSt(s=>({...s,settings:snap.exists?snap.data():null}));done('settings')},onErr));
        COLS.forEach(c=>unsubs.push(root.collection(c).onSnapshot(q=>{const m={};q.docs.forEach(d=>{m[d.id]={...d.data(),id:d.id}});setSt(s=>({...s,[c]:m}));done(c)},onErr)));
        setTimeout(()=>{if(!dead)setSt(s=>s.ready?s:{...s,ready:true})},9000);
        return;
      }
      /* ---- Standalone: Supabase ---- */
      let lib;
      try{lib=await loadSupabase()}catch(e){if(!dead){R.current.mode='local';setSt(s=>({...s,ready:true,mode:'local',auth:'offline'}))}return}
      if(dead)return;
      if(!sbClient)sbClient=lib.createClient(SBD_SUPABASE.url,SBD_SUPABASE.key,{auth:{persistSession:true,autoRefreshToken:true}});
      const sb=sbClient;
      const {data:{session}}=await sb.auth.getSession();
      if(dead)return;
      if(!session){R.current.mode='signedout';setSt(s=>({...s,ready:true,mode:'signedout',auth:'signedout',user:null}));
        const {data:sub}=sb.auth.onAuthStateChange((ev,sess)=>{if(sess&&!dead)setAuthTick(t=>t+1)});unsubs.push(()=>sub.subscription.unsubscribe());return}
      const uidv=session.user.id;
      R.current={...R.current,mode:'supabase',uid:uidv};
      setSt(s=>({...s,mode:'supabase',auth:'in',user:{email:session.user.email}}));
      // full load, paged
      const all={settings:null};COLS.forEach(c=>all[c]={});
      try{let from=0;const page=1000;
        for(;;){const {data,error}=await sb.from(SB_TABLE).select('col,id,data').range(from,from+page-1);if(error)throw error;
          (data||[]).forEach(r=>{if(r.col==='settings'){if(r.id==='main')all.settings=r.data}else if(all[r.col])all[r.col][r.id]={...r.data,id:r.id}});
          if(!data||data.length<page)break;from+=page}
      }catch(e){if(!dead){toast(sbErr(e));setSt(s=>({...s,ready:true}))}return}
      if(dead)return;
      setSt(s=>({...s,...all,ready:true}));
      // live updates from other devices
      const ch=sb.channel('sbd-'+uidv).on('postgres_changes',{event:'*',schema:'public',table:SB_TABLE,filter:`user_id=eq.${uidv}`},p=>{
        const row=p.eventType==='DELETE'?p.old:p.new;if(!row||!row.col)return;const key=row.col+'/'+row.id;
        const t=R.current.recent[key];if(t&&Date.now()-t<4000)return; // our own write echoing back
        if(row.col==='settings'){if(row.id==='main')setSt(s=>({...s,settings:p.eventType==='DELETE'?null:row.data}));return}
        if(!COLS.includes(row.col))return;
        setSt(s=>{const m={...s[row.col]};if(p.eventType==='DELETE')delete m[row.id];else m[row.id]={...row.data,id:row.id};return {...s,[row.col]:m}})}).subscribe();
      unsubs.push(()=>{try{sb.removeChannel(ch)}catch(_){}});
      const {data:sub}=sb.auth.onAuthStateChange((ev,sess)=>{if(ev==='SIGNED_OUT'&&!dead){setAuthTick(t=>t+1)}});unsubs.push(()=>sub.subscription.unsubscribe());
    })();
    return()=>{dead=true;unsubs.forEach(u=>{try{u()}catch(e){}})};
  },[authTick]);
  const api=useMemo(()=>{
    const queue=(path,fn)=>{const q=R.current.q;const p=(q[path]||Promise.resolve()).then(fn).catch(e=>{toast(R.current.mode==='supabase'?sbErr(e):errMsg(e))});q[path]=p;return p};
    const sbPut=(col,id,data)=>()=>{R.current.recent[col+'/'+id]=Date.now();return sbClient.from(SB_TABLE).upsert({user_id:R.current.uid,col,id,data,updated_at:new Date().toISOString()},{onConflict:'user_id,col,id'}).then(({error})=>{if(error)throw error})};
    const sbDel=(col,id)=>()=>{R.current.recent[col+'/'+id]=Date.now();return sbClient.from(SB_TABLE).delete().eq('user_id',R.current.uid).eq('col',col).eq('id',id).then(({error})=>{if(error)throw error})};
    return {
      put(col,id,data){const body=strip(data);setSt(s=>({...s,[col]:{...s[col],[id]:{...body,id}}}));const m=R.current.mode;
        if(m==='supabase')return queue(col+'/'+id,sbPut(col,id,body));
        if(m!=='cloud')return Promise.resolve();return queue(col+'/'+id,()=>R.current.root.collection(col).doc(id).set(body))},
      del(col,id){setSt(s=>{const m={...s[col]};delete m[id];return {...s,[col]:m}});const m=R.current.mode;
        if(m==='supabase')return queue(col+'/'+id,sbDel(col,id));
        if(m!=='cloud')return Promise.resolve();return queue(col+'/'+id,()=>R.current.root.collection(col).doc(id).delete())},
      setSettings(next){const body=JSON.parse(JSON.stringify(next));setSt(s=>({...s,settings:body}));const m=R.current.mode;
        if(m==='supabase')return queue('settings',sbPut('settings','main',body));
        if(m!=='cloud')return Promise.resolve();return queue('settings',()=>R.current.root.set(body))},
      async signIn(email,password){if(!sbClient)throw new Error('Can\u2019t reach the server. Open this file in Chrome, Edge or Safari (not a preview window) and check your internet.');
        const t=new Promise((_,rej)=>setTimeout(()=>rej(new Error('No answer from the server after 15 seconds. Check your internet, and make sure you opened this file in a normal browser window.')),15000));
        const {error}=await Promise.race([sbClient.auth.signInWithPassword({email,password}),t]);if(error)throw error},
      async resetPassword(email){const {error}=await sbClient.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});if(error)throw error},
      async signOut(){if(sbClient)await sbClient.auth.signOut();setSt({ready:false,mode:'loading',auth:null,user:null,settings:null,calendars:{},clients:{},events:{},ledger:{},travel:{}});setAuthTick(t=>t+1)}
    };
  },[]);
  return {...st,api};
}

const evStartMs=e=>{const d=parseYmd(e.date);d.setMinutes(e.start||0);return d.getTime()};
const evCids=e=>Array.isArray(e.clientIds)&&e.clientIds.length?e.clientIds:(e.clientId?[e.clientId]:[]);
const firstName=c=>(c&&c.name||'').split(' ')[0];
const effStatus=(e,now)=>{const s=e.status||'scheduled';if(s==='scheduled'&&evCids(e).length&&evStartMs(e)+(e.dur||60)*6e4<now)return 'completed';return s};
const cmpEv=(a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.start||0)-(b.start||0);
let WPM=4; // weeks counted per month (4, or 52/12), set from Setup
const monthlyEq=p=>{if(!p)return 0;const r=Number(p.rate)||0;return p.rateUnit==='month'?r:r*(Number(p.perWeek)||0)*WPM};
const sessionsPerMonth=p=>(Number(p&&p.perWeek)||0)*WPM;
const urgFromDays=d=>d==null?0:d<=0?3:d<=7?2:d<=30?1:0;
const URG_WORD=['On track','Due within a month','Due this week','Due / overdue'];

function deriveAll({clients,events,ledger,settings}){
  const now=Date.now(),today=todayYmd();
  const evInfo={},cs={};
  const byClient={},ledByClient={};
  Object.values(events).forEach(e=>{evCids(e).forEach(cid=>{(byClient[cid]=byClient[cid]||[]).push(e)})});
  Object.values(ledger).forEach(l=>{(ledByClient[l.clientId]=ledByClient[l.clientId]||[]).push(l)});
  const segments=[];
  for(const c of Object.values(clients)){
    const plan=c.plan||{};
    const list=(byClient[c.id]||[]).slice().sort(cmpEv);
    const led=(ledByClient[c.id]||[]).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
    const charges=led.filter(l=>l.kind==='charge').map(l=>({...l,paid:0}));
    const payments=led.filter(l=>l.kind==='payment');
    const regPurchased=(Number(c.sessionAdjust)||0)+sum(charges.filter(x=>!x.expires),x=>x.sessions);
    const wins=[];charges.forEach(ch=>{const cap=Number(ch.perMonth)||0;if(!ch.expires||!cap)return;const m=Math.max(1,Number(ch.months)||1);const s0=ch.periodStart||ch.date;
      for(let k=0;k<m;k++)wins.push({start:addMonthsYmd(s0,k),end:addMonthsYmd(s0,k+1),cap,used:0,counted:0})});
    const purchased=regPurchased+sum(wins,w=>w.cap);
    let n=Number(c.numberOffset)||0,ri=0,regCounted=0,used=0,booked=0,nextEv=null,lastEv=null;
    for(const e of list){
      const gst=effStatus(e,now);const ov=e.statusBy&&e.statusBy[c.id];const st=ov||gst;
      const ei=evInfo[e.id]||(evInfo[e.id]={per:{}});ei.st=gst;
      if(FREED.has(st)){ei.per[c.id]={st};continue}
      n++;const counted=COUNTED.has(st);
      if(counted){used++;lastEv=e}else{booked++;if(!nextEv)nextEv=e}
      const w=wins.find(w=>e.date>=w.start&&e.date<w.end&&w.used<w.cap);
      let left,over=false,mo=false;
      if(w){w.used++;if(counted)w.counted++;left=w.cap-w.used;mo=true}
      else{ri++;if(counted)regCounted++;left=regPurchased-ri;over=ri>regPurchased}
      ei.per[c.id]={st,n,left,over,mo};
      if(over)ei.anyOver=true;
    }
    // FIFO payments -> charges
    let ci=0;
    for(const p of payments){
      let amt=Number(p.amount)||0;
      while(amt>0.004&&ci<charges.length){
        const ch=charges[ci];const need=(Number(ch.amount)||0)-ch.paid;
        if(need<=0.004){ci++;continue}
        const take=Math.min(need,amt);ch.paid+=take;amt-=take;
        segments.push({date:p.date,amount:take,charge:ch,client:c,payId:p.id});
        if(ch.paid>=(Number(ch.amount)||0)-0.004)ci++;
      }
      if(amt>0.004)segments.push({date:p.date,amount:amt,charge:null,client:c,payId:p.id});
    }
    const billed=sum(charges,x=>x.amount),paidTot=sum(payments,x=>x.amount);
    const balance=round2(billed-paidTot);
    const unpaid=charges.filter(ch=>ch.paid<(Number(ch.amount)||0)-0.004);
    // Next due
    const cyc=plan.billing&&plan.billing!=='pack'?Number(plan.billing):0;
    let paidThrough=null;
    charges.forEach(ch=>{if(Number(ch.months)>0){const end=addMonthsYmd(ch.periodStart||ch.date,Number(ch.months));if(!paidThrough||end>paidThrough)paidThrough=end}});
    const termEnd=plan.startDate&&Number(plan.commitMonths)>0?addMonthsYmd(plan.startDate,Number(plan.commitMonths)):null;
    let nextDue=null,termDone=false;
    // Billing set to a cycle but every purchase is a session pack: judge by sessions left, not a renewal date
    const sessionBilled=!!cyc&&!charges.some(ch=>Number(ch.months)>0)&&charges.some(ch=>Number(ch.sessions)>0);
    if(cyc&&!sessionBilled){nextDue=paidThrough||plan.startDate||null;if(termEnd&&nextDue&&nextDue>=termEnd){termDone=true;nextDue=null}}
    const expired=sum(wins.filter(w=>w.end<=today),w=>Math.max(0,w.cap-w.counted));
    const remaining=(regPurchased-regCounted)+sum(wins.filter(w=>w.end>today),w=>w.cap-w.counted),unbooked=remaining-booked;
    const active=(c.status||'active')==='active';
    let urg=0,reason='Up to date';
    if(active){
      if(cyc&&nextDue&&!sessionBilled){const d=daysBetween(today,nextDue);const u=urgFromDays(d);if(u>=urg){urg=u;reason=d<0?`Renewal ${-d}d overdue`:d===0?'Renewal due today':`Renewal in ${d}d`}}
      if(plan.billing==='pack'||sessionBilled){const th=Number(settings&&settings.packThreshold)||2;const u=remaining<=0?3:remaining<=th?2:remaining<=th+3?1:0;if(u>urg||(u&&u===urg)){urg=Math.max(urg,u);reason=remaining<=0?'Out of sessions':`${remaining} session${remaining===1?'':'s'} left`}}
      if(unpaid.length){const amt=money(round2(sum(unpaid,ch=>ch.amount-ch.paid)));const d=Math.min(...unpaid.map(ch=>daysBetween(today,ch.dueDate||ch.date)));const u=d<0?3:d<=7?2:1;
        if(u>=urg){urg=u;reason=d<0?`${amt} overdue (${-d}d)`:d===0?`${amt} due today`:`${amt} due in ${d}d`}}
    }
    cs[c.id]={purchased,used,expired,booked,remaining,unbooked,nextN:n+1,nextLeft:remaining-booked-1,charges,payments,balance,unpaid,paidThrough,nextDue,termEnd,termDone,urg,reason,nextEv,lastEv,list,active};
  }
  return {evInfo,cs,segments};
}

function spreadMonths(seg){
  const ch=seg.charge;
  if(!ch)return {start:seg.date,n:1};
  let n=Number(ch.months)||0;
  if(!n&&Number(ch.sessions)>0){const spm=sessionsPerMonth(seg.client.plan);n=spm>0?Math.max(1,Math.round(Number(ch.sessions)/spm)):1}
  return {start:ch.periodStart||ch.date,n:Math.max(1,n)};
}
function gstShare(amount,flag,settings){if(!flag||!settings.gstRegistered)return 0;const r=(Number(settings.gstRate)||0)/100;return amount*r/(1+r)}
function finance(derived,clients,settings,year){
  const months=Array.from({length:12},(_,m)=>({m,collected:0,gst:0,tax:0,keep:0,spread:0,spreadKeep:0,spreadTax:0,spreadGst:0,proj:0,projKeep:0}));
  const tr=(Number(settings.taxRate)||0)/100;
  for(const seg of derived.segments){
    const flag=seg.charge?!!seg.charge.gst:!!settings.gstIncluded;
    const g=gstShare(seg.amount,flag,settings),net=seg.amount-g,tax=net*tr;
    const d=parseYmd(seg.date);
    if(d.getFullYear()===year){const M=months[d.getMonth()];M.collected+=seg.amount;M.gst+=g;M.tax+=tax;M.keep+=net-tax}
    const {start,n}=spreadMonths(seg);const s=parseYmd(start);
    for(let k=0;k<n;k++){const dt=new Date(s.getFullYear(),s.getMonth()+k,1);if(dt.getFullYear()!==year)continue;const M=months[dt.getMonth()];
      M.spread+=seg.amount/n;M.spreadGst+=g/n;M.spreadTax+=tax/n;M.spreadKeep+=(net-tax)/n}
  }
  // Projection: active plans beyond what's been charged
  const now=new Date(),curKey=now.getFullYear()*12+now.getMonth();
  for(const c of Object.values(clients)){
    const cs=derived.cs[c.id];const p=c.plan||{};if(!cs||!cs.active)continue;
    const meq=monthlyEq(p);if(!meq)continue;
    let fromYmd;
    if(p.billing==='pack'){const spm=sessionsPerMonth(p);const cover=spm>0?Math.max(0,cs.remaining)/spm:0;fromYmd=ymd(new Date(now.getFullYear(),now.getMonth()+Math.ceil(cover),1))}
    else fromYmd=cs.paidThrough||p.startDate||todayYmd();
    const endYmd=cs.termEnd||addMonthsYmd(todayYmd(),12);
    const f=parseYmd(fromYmd);let key=Math.max(f.getFullYear()*12+f.getMonth(),curKey);
    const e=parseYmd(endYmd);const endKey=e.getFullYear()*12+e.getMonth();
    const flag=!!settings.gstRegistered&&!settings.gstIncluded&&!p.noGst;
    const gross=flag?meq*(1+(Number(settings.gstRate)||0)/100):meq;
    const g=gstShare(gross,settings.gstRegistered,settings),net=gross-g;
    for(;key<endKey;key++){const y=Math.floor(key/12),m=key%12;if(y!==year)continue;months[m].proj+=gross;months[m].projKeep+=net*(1-tr)}
  }
  return months;
}
function mileage(travel,settings,year){
  const locs=Object.fromEntries((settings.locations||[]).map(l=>[l.id,l]));
  let km=0;const rows=[];
  Object.values(travel).forEach(t=>{if(!t.date||parseYmd(t.date).getFullYear()!==year)return;const k=dayKm(t,locs);km+=k;rows.push({...t,km:k})});
  const r1=Number(settings.kmRate1)||0,r2=Number(settings.kmRate2)||0;
  const ded=Math.min(km,5000)*r1+Math.max(0,km-5000)*r2;
  return {km,ded,rows:rows.sort((a,b)=>a.date<b.date?1:-1)};
}
const dayKm=(t,locs)=>sum(t.stops||[],id=>locs[id]?locs[id].km:0)+(Number(t.extraKm)||0);

function calcMacros({w,h,age,sex,activity,goalPct,protein,fatPct}){
  if(!w||!h||!age)return null;
  const bmr=10*w+6.25*h-5*age+(sex==='female'?-161:5);
  const tdee=bmr*activity;const kcal=Math.round(tdee*(1+goalPct/100)/10)*10;
  const p=Math.round(w*protein),f=Math.round(kcal*fatPct/100/9),c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,p,f,c};
}

function weekStartOf(d,ws){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const diff=(x.getDay()-ws+7)%7;return addDays(x,-diff)}
function layoutDay(evs){
  const out=[];let cluster=[],cEnd=-1;
  const flush=()=>{const lanes=[];cluster.forEach(e=>{let i=lanes.findIndex(end=>end<=e.start);if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=e.start+e.dur;e._lane=i});cluster.forEach(e=>{e._lanes=lanes.length;out.push(e)});cluster=[];cEnd=-1};
  evs.forEach(e=>{if(cluster.length&&e.start>=cEnd)flush();cluster.push(e);cEnd=Math.max(cEnd,e.start+e.dur)});
  if(cluster.length)flush();return out;
}

try{document.addEventListener('touchmove',e=>{if(dragActive&&e.cancelable)e.preventDefault()},{passive:false})}catch(_){}
const VIEW_LABEL={day:'Day','3day':'3 Day',week:'Week',month:'Month',agenda:'List'};

function CalendarPage({ctx}){
  const {settings,calendars,clients,events,travel,api,derived,isM}=ctx;
  const allowed=isM?['day','3day','month','agenda']:['day','week','month','agenda'];
  const [views,setViews]=useState(()=>({m:ls.get('view-m','day'),d:ls.get('view-d','week')}));
  let view=isM?views.m:views.d;
  if(!allowed.includes(view))view=isM?'3day':'week';
  const setView=v=>setViews(s=>{const n={...s,[isM?'m':'d']:v};ls.set('view-m',n.m);ls.set('view-d',n.d);return n});
  const [cursor,setCursor]=useState(todayYmd());
  const [hidden,setHidden]=useState(()=>new Set(ls.get('hiddenCals',[])));
  const [modal,setModal]=useState(null);
  const [sideOpen,setSideOpen]=useState(false);
  const [drag,setDrag]=useState(null);
  const dragRef=useRef(null);const lastDragEnd=useRef(0);const swipe=useRef(null);
  const bodyRef=useRef(null);
  const [,tick]=useState(0);
  useEffect(()=>{const t=setInterval(()=>tick(x=>x+1),60000);return()=>clearInterval(t)},[]);
  const sH=Number(settings.dayStartHour)||5,eH=Number(settings.dayEndHour)||22;
  const HOUR=isM?56:52;
  const timed=view==='day'||view==='week'||view==='3day';
  useEffect(()=>{if(bodyRef.current&&timed){const n=new Date();const h=clamp(n.getHours()-2,sH,eH);bodyRef.current.scrollTop=(Math.max(h,7)-sH)*HOUR}},[view,isM]);

  const cals=Object.values(calendars).sort((a,b)=>(a.order||0)-(b.order||0));
  const calById=calendars;
  const locs=Object.fromEntries((settings.locations||[]).map(l=>[l.id,l]));
  const baseline=settings.baseline||[];
  const [showBase,setShowBase]=useState(()=>ls.get('showBaseline',true));
  const slotsFor=k=>{const dow=parseYmd(k).getDay();return baseline.filter(b=>Number(b.dow)===dow&&(!b.from||b.from<=k)&&(!b.until||k<=b.until)&&(b.clientIds||[]).some(id=>clients[id]&&(clients[id].status||'active')!=='former'))};
  const toggleCal=id=>{const s=new Set(hidden);s.has(id)?s.delete(id):s.add(id);setHidden(s);ls.set('hiddenCals',[...s])};

  const cur=parseYmd(cursor);
  const ws=Number(settings.weekStart)||0;
  let days=[];
  if(view==='day')days=[cur];
  else if(view==='3day')days=[0,1,2].map(i=>addDays(cur,i));
  else if(view==='week'){const s=weekStartOf(cur,ws);days=Array.from({length:7},(_,i)=>addDays(s,i))}
  const STEP={day:1,'3day':3,week:7,agenda:7};
  const step=dir=>{if(view==='month')setCursor(ymd(new Date(cur.getFullYear(),cur.getMonth()+dir,1)));else setCursor(ymd(addDays(cur,STEP[view]*dir)))};
  const range=(a,b)=>a.getMonth()===b.getMonth()?`${MONTHS[a.getMonth()]} ${a.getDate()}–${b.getDate()}`:`${MONTHS[a.getMonth()]} ${a.getDate()} – ${MONTHS[b.getMonth()]} ${b.getDate()}`;
  const title=view==='month'?`${cur.toLocaleDateString('en-CA',{month:isM?'short':'long'})} ${cur.getFullYear()}`
    :(view==='week'||view==='3day')?range(days[0],days[days.length-1])
    :view==='agenda'?`${MONTHS[cur.getMonth()]} ${cur.getDate()} on`
    :cur.toLocaleDateString('en-CA',isM?{weekday:'short',month:'short',day:'numeric'}:{weekday:'long',month:'short',day:'numeric'});

  const evList=useMemo(()=>Object.values(events).map(e=>drag&&drag.id===e.id?{...e,date:drag.date,start:drag.start,_drag:true}:e).filter(e=>!hidden.has(e.calendarId)),[events,drag,hidden]);
  const byDate=useMemo(()=>{const m={};evList.forEach(e=>{(m[e.date]=m[e.date]||[]).push(e)});Object.values(m).forEach(a=>a.sort(cmpEv));return m},[evList]);
  const openEv=e=>setModal({type:'event',ev:events[e.id]||e});

  /* ---- drag: mouse drags right away; touch needs a long-press so the grid can still scroll ---- */
  const onDown=(e,ev,mode)=>{
    if(e.button!==undefined&&e.button!==0)return;
    const touch=e.pointerType==='touch';
    if(!touch)e.preventDefault();
    e.stopPropagation();
    const rect=e.currentTarget.getBoundingClientRect();
    const d={ev,mode,touch,x0:e.clientX,y0:e.clientY,offY:e.clientY-rect.top,moved:false,armed:!touch,date:ev.date,start:ev.start};
    dragRef.current=d;
    let timer=null;
    const arm=()=>{d.armed=true;dragActive=true;document.body.classList.add('dragging');setDrag({id:ev.id,date:ev.date,start:ev.start});try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}};
    if(touch)timer=setTimeout(()=>{if(dragRef.current===d)arm()},380);else document.body.classList.add('dragging');
    const cleanup=()=>{clearTimeout(timer);dragActive=false;document.body.classList.remove('dragging');removeEventListener('pointermove',move);removeEventListener('pointerup',up);removeEventListener('pointercancel',up)};
    const move=me=>{if(dragRef.current!==d)return;
      if(!d.armed){if(Math.hypot(me.clientX-d.x0,me.clientY-d.y0)>8){cleanup();dragRef.current=null}return}
      if(!d.moved&&Math.hypot(me.clientX-d.x0,me.clientY-d.y0)<5)return;d.moved=true;
      const els=document.elementsFromPoint(me.clientX,me.clientY);
      if(d.mode==='grid'){const col=els.find(x=>x.dataset&&x.dataset.col);if(col){const r=col.getBoundingClientRect();let m=sH*60+((me.clientY-d.offY)-r.top)/HOUR*60;m=clamp(Math.round(m/15)*15,sH*60,eH*60-(d.ev.dur||60));d.date=col.dataset.col;d.start=m;setDrag({id:d.ev.id,date:d.date,start:m})}
        const b=bodyRef.current;if(b){const br=b.getBoundingClientRect();if(me.clientY>br.bottom-30)b.scrollTop+=12;else if(me.clientY<br.top+30)b.scrollTop-=12}}
      else{const cell=els.find(x=>x.dataset&&x.dataset.cell);if(cell){d.date=cell.dataset.cell;setDrag({id:d.ev.id,date:d.date,start:d.ev.start})}}
    };
    const up=pe=>{cleanup();if(dragRef.current!==d)return;dragRef.current=null;setDrag(null);
      if(d.touch&&d.armed)lastDragEnd.current=Date.now();
      if(pe&&pe.type==='pointercancel')return;
      if(!d.moved){openEv(d.ev);return}
      lastDragEnd.current=Date.now();
      if(d.date!==d.ev.date||d.start!==d.ev.start){
        const orig=events[d.ev.id];if(!orig)return;
        api.put('events',orig.id,{...orig,date:d.date,start:d.start});
        toast(`Moved to ${fmtDate(d.date)} · ${fmtTime(d.start)}`);
      }};
    addEventListener('pointermove',move);addEventListener('pointerup',up);addEventListener('pointercancel',up);
  };
  const newAt=(date,start)=>{if(Date.now()-lastDragEnd.current<350)return;setModal({type:'event',ev:{date,start,dur:60}})};
  const newEvent=(date,start)=>{setSideOpen(false);setModal({type:'event',ev:{date,start,dur:60}})};
  const defStart=()=>cursor===todayYmd()?clamp((new Date().getHours()+1)*60,sH*60,eH*60-60):9*60;
  const swStart=e=>{if(!isM)return;const t=e.touches[0];swipe.current={x:t.clientX,y:t.clientY,t:Date.now()}};
  const swEnd=e=>{const s=swipe.current;swipe.current=null;if(!s||dragActive||Date.now()-lastDragEnd.current<500)return;const t=e.changedTouches[0];const dx=t.clientX-s.x,dy=t.clientY-s.y;if(Math.abs(dx)>70&&Math.abs(dy)<45&&Date.now()-s.t<700)step(dx<0?1:-1)};

  /* ---- week stats ---- */
  const wkDays=view==='week'?days:Array.from({length:7},(_,i)=>addDays(weekStartOf(cur,ws),i));
  const wkStats=useMemo(()=>{
    let open=0,booked=0,km=0,reserved=0;
    wkDays.forEach(d=>{const k=ymd(d);const wins=(settings.trainingHours||{})[String(d.getDay())]||[];
      const evs=(Object.values(events).filter(e=>e.date===k&&!FREED.has(e.status||'scheduled')));
      evs.forEach(e=>{if(evCids(e).length)booked++});
      const sl=slotsFor(k);reserved+=sl.length;
      const busy=[...evs.map(e=>[e.start,e.start+(e.dur||60)]),...sl.map(g=>[g.start,g.start+(g.dur||60)])].sort((a,b)=>a[0]-b[0]);
      wins.forEach(w=>{let used=0,cur=null;busy.forEach(([s0,e0])=>{const a=Math.max(w.s,s0),b=Math.min(w.e,e0);if(b<=a)return;if(cur&&a<=cur[1])cur[1]=Math.max(cur[1],b);else{if(cur)used+=cur[1]-cur[0];cur=[a,b]}});if(cur)used+=cur[1]-cur[0];open+=Math.max(0,w.e-w.s-used)});
      const t=travel[k];if(t)km+=dayKm(t,locs)});
    return {open:Math.round(open/60*10)/10,booked,km,reserved};
  },[events,travel,settings,cursor,view]);

  const today=todayYmd();
  const nowD=new Date();const nowMin=nowD.getHours()*60+nowD.getMinutes();

  const TravelChip=(date)=>{const t=travel[date];const k=t?dayKm(t,locs):0;
    const names=t?(t.stops||[]).map(id=>locs[id]?locs[id].name:null).filter(Boolean):[];
    return html`<button class=${'travbtn'+(t?' on':'')} title=${t?names.join(' → ')+` · ${k} km`:'Add travel for this day'} onClick=${ev=>{ev.stopPropagation();setModal({type:'travel',date})}}><${Icon} n="car" s=${12}/>${t?(k>0?`${Math.round(k)} km`:`${names.length} stop${names.length===1?'':'s'}`):'Travel'}</button>`};

  const evMeta=e=>{const cal=calById[e.calendarId]||{color:'#6B7078',icon:'star',name:''};
    const ei=derived.evInfo[e.id]||{};const ids=evCids(e);const cls=ids.map(id=>clients[id]).filter(Boolean);const cl=cls[0]||null;
    const st=ids.length?(ei.st||e.status||'scheduled'):(e.status||'scheduled');
    const per=cls.map(c=>(ei.per||{})[c.id]).filter(p=>p&&p.n);const uq=a=>[...new Set(a)].join('/');
    const info={n:per.length?uq(per.map(p=>p.n)):'',left:per.length?uq(per.map(p=>p.left)):'',over:!!ei.anyOver,mo:per.some(p=>p.mo)};
    const exc=cls.length>1?cls.map(c=>{const p=(ei.per||{})[c.id];return p&&p.st!==st&&['late','noshow','cancelled','sick','sickused'].includes(p.st)?`${firstName(c)}: ${STATUS_LABEL[p.st]}`:null}).filter(Boolean):[];
    const icon=st==='sick'||st==='sickused'?'sick':st==='late'?'alert':st==='noshow'?'ghost':cal.icon;
    const stCls=st==='late'||st==='sickused'?' late':st==='noshow'?' noshow':st==='cancelled'||st==='sick'?' cancelled':'';
    const label=cls.length>1?cls.map(firstName).join(' & '):cl?cl.name:(e.title||'Untitled');
    const diab=cls.some(x=>diabRisk(x).hypo);
    return {cal,info,cl,cls,exc,st,icon,stCls,label,diab}};

  const EvBlock=(e)=>{
    const {cal,info,cl,cls:group,exc,st,icon,stCls,label,diab}=evMeta(e);
    const top=(e.start-sH*60)/60*HOUR,h=Math.max(18,(e.dur||60)/60*HOUR-2);
    const w=100/(e._lanes||1),l=(e._lane||0)*w;
    const cls='ev'+stCls+(st==='completed'&&cl?' done':'')+(e._drag?' drag':'');
    return html`<div key=${e.id} class=${cls} style=${`--c:${cal.color};top:${top}px;height:${h}px;left:calc(${l}% + 2px);width:calc(${w}% - 5px)`}
      onPointerDown=${ev=>onDown(ev,e,'grid')} onClick=${ev=>ev.stopPropagation()} onContextMenu=${ev=>ev.preventDefault()} role="button" tabindex="0"
      onKeyDown=${ev=>{if(ev.key==='Enter')openEv(e)}}
      title=${`${label} · ${fmtTime(e.start)}–${fmtTime(e.start+(e.dur||60))}${st!=='scheduled'?' · '+STATUS_LABEL[st]:''}`}>
      <div class="t1"><span class="ch"><${Icon} n=${icon} s=${11} w=${2.4}/></span>${group.length>1&&html`<${Icon} n="users" s=${12}/>`}<span class="nm">${label}</span><span class="done-ck" title="Completed"><${Icon} n="check" s=${10} w=${3.2}/></span>${diab&&html`<span class="diab" title="Diabetes: check glucose before training"><${Icon} n="drop" s=${11}/></span>`}${cl&&info.n&&html`<span class="sn" style="margin-left:auto;flex:none" title="Session number">#${info.n}</span>`}</div>
      ${h>30&&html`<div class="t2"><span>${fmtTime(e.start)}–${fmtTime(e.start+(e.dur||60))}</span>
        ${cl&&info.n&&html`<span title="Paid sessions left after this one">${info.left} left${info.mo?' this mo':''}</span>`}
        ${st==='late'&&html`<b style="color:var(--r)">Late cancel</b>`}${st==='sickused'&&html`<b style="color:var(--r)">Sick · used</b>`}${st==='sick'&&html`<b>Sick · kept</b>`}${st==='noshow'&&html`<b style="color:var(--r)">No-show</b>`}${exc.map(x=>html`<b style="color:var(--r)">${x}</b>`)}
        ${e.note&&html`<${Icon} n="note" s=${12}/>`}</div>`}
      ${h>56&&cl&&info.over&&html`<div class="t2" style="color:var(--r);font-weight:700">Not paid for yet</div>`}
      ${h>56&&e.title&&cl&&e.title!==label&&html`<div class="t2">${e.title}</div>`}
    </div>`;
  };

  const GhostBlock=(g,k)=>{const cl=(g.clientIds||[]).map(id=>clients[id]).filter(Boolean);if(!cl.length)return null;
    const cal=calById[g.calendarId]||calById.training||{color:'#6B7078'};
    const label=cl.length>1?cl.map(firstName).join(' & '):cl[0].name;
    const dayEv=(byDate[k]||[]).filter(e=>!FREED.has(e.status||'scheduled')&&evCids(e).some(id=>g.clientIds.includes(id)));
    const atSlot=dayEv.find(e=>Math.abs((e.start||0)-g.start)<15);const moved=!atSlot&&dayEv[0];
    const top=(g.start-sH*60)/60*HOUR,h=Math.max(18,(g.dur||60)/60*HOUR-2);const w=100/(g._lanes||1),l=(g._lane||0)*w;
    const state=atSlot?'booked':moved?'moved':'open';
    return html`<div key=${'g'+g.id} class=${'bl-ghost gh-'+state} style=${`--c:${cal.color};top:${top}px;height:${h}px;left:calc(${l}% + 2px);width:calc(${w}% - 5px)`}
      title=${`${label} · locked-in ${fmtTime(g.start)}–${fmtTime(g.start+(g.dur||60))}${state==='open'?' · not booked yet, tap to book':state==='moved'?` · moved to ${fmtTime(moved.start)}`:''}`}
      onClick=${ev=>{ev.stopPropagation();if(Date.now()-lastDragEnd.current<350)return;if(state==='booked')return;setModal({type:'event',ev:{date:k,start:g.start,dur:g.dur||60,clientIds:g.clientIds.filter(id=>clients[id]),calendarId:g.calendarId||cal.id||'training',location:g.location||''}})}}>
      ${state!=='booked'&&html`<span class="gh-nm">${label}</span><span class="gh-st">${state==='moved'?`Moved to ${fmtTime(moved.start)}`:'Locked in · tap to book'}</span>`}
    </div>`};
  const bookWeek=()=>{let n=0;wkDays.forEach(d=>{const k=ymd(d);slotsFor(k).forEach(g=>{const ids=(g.clientIds||[]).filter(id=>clients[id]);if(!ids.length)return;
      const has=Object.values(events).some(e=>e.date===k&&!FREED.has(e.status||'scheduled')&&evCids(e).some(id=>ids.includes(id)));if(has)return;
      api.put('events',uid(),{calendarId:g.calendarId||'training',title:'',clientIds:ids,clientId:ids[0],statusBy:{},status:'scheduled',note:'',date:k,start:Number(g.start),dur:Number(g.dur)||60,location:g.location||'',created:Date.now(),fromBaseline:g.id});n++})});
    toast(n?`Booked ${n} session${n===1?'':'s'} from your baseline`:'Every baseline slot this week is already booked')};
  const TimeGrid=()=>{
    const cols=`${isM?44:56}px repeat(${days.length},minmax(0,1fr))`;
    const H=(eH-sH)*HOUR;
    return html`<div class="grid-shell">
      <div class="g-head" style=${`grid-template-columns:${cols}`}><div></div>
        ${days.map(d=>{const k=ymd(d);return html`<div class=${'gh'+(k===today?' today':'')}>
          <div class="dn">${DOW[d.getDay()]}</div>
          <button class="dd dbtn" onClick=${()=>{setCursor(k);setView('day')}} aria-label=${'Open '+fmtDate(k)}>${d.getDate()}</button>
          <div class="trav">${TravelChip(k)}</div></div>`})}
      </div>
      <div class="g-body" ref=${bodyRef} onTouchStart=${swStart} onTouchEnd=${swEnd}>
        <div class="g-cols" style=${`grid-template-columns:${cols};height:${H}px;--hour:${HOUR}px`}>
          <div class="g-gutter">${Array.from({length:eH-sH},(_,i)=>i>0&&html`<span style=${`top:${i*HOUR}px`}>${fmtTime((sH+i)*60)}</span>`)}</div>
          ${days.map(d=>{const k=ymd(d);
            const wins=((settings.trainingHours||{})[String(d.getDay())]||[]).slice().sort((a,b)=>a.s-b.s);
            const offs=[];let p=sH*60;wins.forEach(w=>{if(w.s>p)offs.push([p,Math.min(w.s,eH*60)]);p=Math.max(p,w.e)});if(p<eH*60)offs.push([p,eH*60]);
            const evs=layoutDay((byDate[k]||[]).map(e=>({...e,start:e.start||0,dur:e.dur||60})));
            const ghosts=showBase?layoutDay(slotsFor(k).map(g=>({...g,start:Number(g.start)||0,dur:Number(g.dur)||60})).sort((a,b)=>a.start-b.start)):[];
            return html`<div class=${'g-col'+(k===today?' today':'')} data-col=${k}
              onClick=${ev=>{const r=ev.currentTarget.getBoundingClientRect();const m=clamp(Math.floor((sH*60+(ev.clientY-r.top)/HOUR*60)/30)*30,sH*60,eH*60-30);newAt(k,m)}}>
              ${offs.filter(o=>o[1]>o[0]).map(o=>html`<div class="off" style=${`top:${(o[0]-sH*60)/60*HOUR}px;height:${(o[1]-o[0])/60*HOUR}px`}></div>`)}
              ${k===today&&nowMin>=sH*60&&nowMin<=eH*60&&html`<div class="nowline" style=${`top:${(nowMin-sH*60)/60*HOUR}px`}></div>`}
              ${ghosts.map(g=>GhostBlock(g,k))}
              ${evs.map(e=>EvBlock(e))}
            </div>`})}
        </div>
      </div></div>`;
  };

  const AgendaItem=e=>{const {cal,info,cl,cls:group,exc,st,icon,stCls,label,diab}=evMeta(e);
    const meta=[cl?null:cal.name,group.length>1?'Partner session':null,cl&&info.n?`Session #${info.n} · ${info.left} left${info.mo?' this month':''}`:null].filter(Boolean).join(' · ');
    return html`<button key=${e.id} class=${'ag-ev'+stCls} style=${`--c:${cal.color}`} onClick=${()=>openEv(e)}>
      <span class="ag-time num">${fmtTime(e.start)}<small>${fmtTime(e.start+(e.dur||60))}</small></span>
      <span class="ag-ic"><${Icon} n=${icon} s=${14} w=${2.3}/></span>
      <span class="ag-main"><b>${label}</b>${meta&&html`<small>${meta}</small>`}
        ${st!=='scheduled'&&st!=='completed'&&html`<small class="ag-st">${STATUS_LABEL[st]}</small>`}
        ${exc.map(x=>html`<small class="ag-st">${x}</small>`)}
        ${diab&&st==='scheduled'&&html`<small class="ag-diab"><${Icon} n="drop" s=${11}/> Check glucose before training</small>`}
        ${cl&&info.over&&html`<small class="ag-st">Not paid for yet</small>`}
        ${e.note&&html`<small class="ag-note"><${Icon} n="note" s=${11}/> ${e.note}</small>`}</span>
    </button>`};
  const AgendaList=dates=>html`<div class="agenda">${dates.map(k=>{const evs=byDate[k]||[];const d=parseYmd(k);
      const hasHours=((settings.trainingHours||{})[String(d.getDay())]||[]).length>0;
      if(dates.length>1&&!evs.length&&!hasHours&&k!==today)return null;
      return html`<section class="ag-day" key=${k}>
        <header class=${'ag-h'+(k===today?' today':'')}><span class="ag-d"><b>${d.getDate()}</b><span>${DOW[d.getDay()]}<br/>${MONTHS[d.getMonth()]}</span></span>
          <span class="sp"></span>${TravelChip(k)}<button class="iconbtn" aria-label=${'Add to '+fmtDate(k)} onClick=${()=>newEvent(k,k===today?defStart():9*60)}><${Icon} n="plus"/></button></header>
        ${evs.length?evs.map(AgendaItem):html`<div class="ag-empty">${hasHours?'Open training day, nothing booked':'Nothing scheduled'}</div>`}</section>`})}</div>`;

  const MonthGrid=()=>{
    const first=new Date(cur.getFullYear(),cur.getMonth(),1);const start=weekStartOf(first,ws);
    const cells=Array.from({length:42},(_,i)=>addDays(start,i));
    const heads=Array.from({length:7},(_,i)=>DOW[(ws+i)%7]);
    if(isM)return html`<div class="grid-shell" onTouchStart=${swStart} onTouchEnd=${swEnd}><div class="m-head">${heads.map(h=>html`<div style="text-align:center;padding-inline:0">${h[0]}</div>`)}</div>
      <div class="mm-grid">${cells.map(d=>{const k=ymd(d);const evs=byDate[k]||[];
        return html`<button class=${'mm-cell'+(d.getMonth()!==cur.getMonth()?' out':'')+(k===today?' today':'')+(k===cursor?' sel':'')} onClick=${()=>setCursor(k)} aria-label=${fmtDate(k)+(evs.length?`, ${evs.length} events`:'')}>
          <span class="md">${d.getDate()}</span>
          <span class="mm-dots">${evs.slice(0,4).map(e=>{const m=evMeta(e);return html`<i style=${`background:${m.stCls&&!FREED.has(m.st)?'var(--r)':m.cal.color}`}></i>`})}</span></button>`})}</div></div>
      <div style="margin-top:12px">${AgendaList([cursor])}</div>`;
    return html`<div class="grid-shell"><div class="m-head">${heads.map(h=>html`<div>${h}</div>`)}</div>
      <div class="m-grid">${cells.map(d=>{const k=ymd(d);const evs=byDate[k]||[];const t=travel[k];
        return html`<div class=${'m-cell'+(d.getMonth()!==cur.getMonth()?' out':'')+(k===today?' today':'')} data-cell=${k}
          onClick=${()=>newAt(k,9*60)}>

function TravelModal({ctx,date,onClose}){
  const {settings,travel,api}=ctx;
  const cur=travel[date]||{date,stops:[],extraKm:0,note:''};
  const [stops,setStops]=useState(cur.stops||[]);
  const [extra,setExtra]=useState(cur.extraKm||0);
  const [note,setNote]=useState(cur.note||'');
  const [nl,setNl]=useState({name:'',km:''});
  const locs=settings.locations||[];
  const total=sum(stops,id=>{const l=locs.find(x=>x.id===id);return l?l.km:0})+(Number(extra)||0);
  const toggle=id=>setStops(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const addLoc=()=>{if(!nl.name.trim())return;const id=uid();api.setSettings({...settings,locations:[...locs,{id,name:nl.name.trim(),km:Number(nl.km)||0}]});setStops(s=>[...s,id]);setNl({name:'',km:''})};
  const save=()=>{if(!stops.length&&!(Number(extra)>0)){if(travel[date])api.del('travel',date);onClose();return}
    api.put('travel',date,{date,stops,extraKm:Number(extra)||0,note});toast(`Logged ${Math.round(total)} km`);onClose()};
  return html`<${Modal} title=${'Travel · '+fmtDate(date)} onClose=${onClose}
    footer=${html`${travel[date]&&html`<${DeleteBtn} label="Clear day" onConfirm=${()=>{api.del('travel',date);onClose()}}/>`}<span class="sp"></span><button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" onClick=${save}>Save · ${Math.round(total)} km</button>`}>
    <p class="fhint" style="margin:0">Pick where you drove today. Distances are round trips from ${settings.homeLabel||'your home office'}.</p>
    <div style="display:flex;flex-direction:column;gap:6px">${locs.map(l=>html`<label class="check" style="justify-content:space-between;border:1px solid var(--line);border-radius:6px;padding:8px 10px">
      <span style="display:flex;gap:8px;align-items:center"><input type="checkbox" checked=${stops.includes(l.id)} onChange=${()=>toggle(l.id)}/>${l.name}</span><span class="num muted">${l.km||0} km${!l.km?' — set in Setup':''}</span></label>`)}</div>
    <div class="fgrid"><${Field} label="New location"><input type="text" value=${nl.name} placeholder="e.g. Client home – St. Vital" onInput=${e=>setNl({...nl,name:e.target.value})}/><//>
      <${Field} label="Round trip km"><input type="number" min="0" value=${nl.km} onInput=${e=>setNl({...nl,km:e.target.value})}/><//>
      <div class="field" style="justify-content:flex-end"><button class="btn" onClick=${addLoc}><${Icon} n="plus"/>Add & select</button></div></div>
    <div class="fgrid"><${Field} label="Extra km"><input type="number" min="0" value=${extra} onInput=${e=>setExtra(e.target.value)}/><//>
      <${Field} label="Purpose / note" wide><input type="text" value=${note} placeholder="Business purpose for your logbook" onInput=${e=>setNote(e.target.value)}/><//></div>
  <//>`;
}

function BaselineModal({ctx,onClose}){
  const {settings,clients,calendars,api}=ctx;
  const list=settings.baseline||[];
  const cals=Object.values(calendars).sort((a,b)=>(a.order||0)-(b.order||0));
  const defCal=(cals.find(c=>c.icon==='barbell')||cals[0]||{}).id||'training';
  const [q,setQ]=useState('');const [onlyMissing,setOnlyMissing]=useState(false);const [more,setMore]=useState(null);
  const ws=Number(settings.weekStart)||0;const order=Array.from({length:7},(_,i)=>(ws+i)%7);
  const weekStart=ymd(weekStartOf(new Date(),ws));
  const commit=next=>api.setSettings({...settings,baseline:next});
  const active=Object.values(clients).filter(c=>(c.status||'active')==='active').sort((a,b)=>a.name.localeCompare(b.name));
  // one row per client, partners share a row
  const rows=[];const seen=new Set();
  active.forEach(c=>{if(seen.has(c.id))return;const p=c.partnerId&&clients[c.partnerId]&&(clients[c.partnerId].status||'active')==='active'?clients[c.partnerId]:null;
    const ids=p?[c.id,p.id]:[c.id];ids.forEach(i=>seen.add(i));rows.push({ids,people:p?[c,p]:[c]})});
  const slotsOf=ids=>list.filter(b=>(b.clientIds||[])[0]&&ids.includes(b.clientIds[0])).sort((a,b)=>(order.indexOf(Number(a.dow))-order.indexOf(Number(b.dow)))||(a.start-b.start));
  const updSlot=(id,patch)=>commit(list.map(x=>x.id===id?{...x,...patch}:x));
  const delSlot=id=>commit(list.filter(x=>x.id!==id));
  const addSlot=ids=>{const mine=slotsOf(ids);const used=new Set(mine.map(x=>Number(x.dow)));
    const last=mine[mine.length-1];const li=last?order.indexOf(Number(last.dow)):-1;
    const skip=last?order[(li+2)%7]:1;
    const day=(!used.has(skip)&&skip!==0?skip:null)??order.find(d=>!used.has(d)&&d!==0&&order.indexOf(d)>li)??order.find(d=>!used.has(d))??1;
    commit([...list,{id:uid(),clientIds:ids,dow:day,start:last?Number(last.start):17*60,dur:last?Number(last.dur)||60:60,from:weekStart,until:'',note:'',calendarId:last&&last.calendarId||defCal}])};
  const qq=q.trim().toLowerCase();
  const shown=rows.filter(r=>(!qq||r.people.some(p=>p.name.toLowerCase().includes(qq)))&&(!onlyMissing||slotsOf(r.ids).length<(Number(r.people[0].plan&&r.people[0].plan.perWeek)||1)));
  const totalSlots=list.filter(b=>(b.clientIds||[]).some(id=>clients[id])).length;
  const today=todayYmd();
  return html`<${Modal} title="Baseline schedule" wide onClose=${onClose} footer=${html`<span class="fhint">${rows.length} clients · ${totalSlots} weekly slots · saves as you go</span><span class="sp"></span><button class="btn primary" onClick=${onClose}>Done</button>`}>
    <p class="fhint" style="margin:0">Set each client's standing weekly times. They show as faint dashed outlines in every week on the calendar, so you can see what's locked in and what's open.</p>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input type="text" placeholder="Search clients" value=${q} onInput=${e=>setQ(e.target.value)} style="max-width:260px" aria-label="Search clients"/>
      <label class="check"><input type="checkbox" checked=${onlyMissing} onChange=${e=>setOnlyMissing(e.target.checked)}/>Only clients missing slots</label>
    </div>
    <div class="bl-list">
      ${shown.length?shown.map(r=>{const c=r.people[0];const plan=c.plan||{};const want=Number(plan.perWeek)||0;const mine=slotsOf(r.ids);

  const count=c&&!draft?Object.values(events).filter(e=>e.calendarId===c.id).length:0;
  return html`<${Modal} title="Calendars" onClose=${onClose} wide
    footer=${html`<button class="btn" onClick=${()=>setDraft({id:uid(),name:'',color:'#2F6FE0',icon:'star',order:list.length})}><${Icon} n="plus"/>New calendar</button><span class="sp"></span>
      ${draft?html`<button class="btn" onClick=${()=>setDraft(null)}>Cancel</button><button class="btn primary" onClick=${()=>{if(!draft.name.trim()){toast('Name the calendar first.');return}api.put('calendars',draft.id,draft);setSel(draft.id);setDraft(null)}}>Create</button>`:html`<button class="btn primary" onClick=${onClose}>Done</button>`}`}>

      ${c?html`<div style="display:flex;flex-direction:column;gap:12px;min-width:0">
        <${Field} label="Name"><input type="text" value=${c.name} onChange=${e=>upd('name',e.target.value)} onInput=${e=>draft&&upd('name',e.target.value)}/><//>
        <div class="field"><span class="flabel">Color</span><div class="swatches">${CAL_COLORS.map(col=>html`<button style=${`--c:${col}`} aria-pressed=${c.color===col} aria-label=${col} onClick=${()=>upd('color',col)}></button>`)}
          <label class=${'sw-custom'+(CAL_COLORS.includes(c.color)?'':' on')} title="Custom colour" style=${CAL_COLORS.includes(c.color)?'':`--c:${c.color}`}><input type="color" value=${/^#[0-9a-f]{6}$/i.test(c.color||'')?c.color:'#888888'} onInput=${e=>{if(draft)upd('color',e.target.value)}} onChange=${e=>upd('color',e.target.value)} aria-label="Custom colour"/><${Icon} n="plus" s=${14}/></label></div>
          <div class="th-color" style="margin-top:8px;max-width:220px"><span class="swatch-now" style=${`background:${c.color}`}></span><input type="text" value=${c.color} aria-label="Colour hex code" onChange=${e=>{const v=e.target.value.trim();const h=v.startsWith('#')?v:'#'+v;if(/^#[0-9a-f]{6}$/i.test(h))upd('color',h.toUpperCase());else toast('Use a hex code like #FF6600.')}}/></div></div>
        <div class="field"><span class="flabel">Icon</span><div class="icons">${CAL_ICONS.map(ic=>html`<button aria-pressed=${c.icon===ic} aria-label=${ic} onClick=${()=>upd('icon',ic)}><${Icon} n=${ic}/></button>`)}</div></div>
        ${!draft&&html`<div>${count?html`<span class="fhint">${count} event${count===1?'':'s'} use this calendar. Move or delete them before removing it.</span>`:html`<${DeleteBtn} label="Delete calendar" onConfirm=${()=>{api.del('calendars',c.id);setSel(null)}}/>`}</div>`}
      </div>`:html`<div class="empty">Pick a calendar to edit.</div>`}

function ClientEditor({ctx,c,onClose,onSaved}){
  const {api,clients}=ctx;
  const [f,setF]=useState(()=>({name:'',phone:'',email:'',dob:'',sex:'male',units:'imperial',heightCm:'',weightKg:'',athleteType:'General population',athleteCustom:'',status:'active',startDate:todayYmd(),sessionAdjust:0,numberOffset:0,...(c||{})}));
  const set=(k,v)=>setF(s=>({...s,[k]:v}));
  const imp=f.units==='imperial';
  const toRaw=(hc,wk)=>{const i=hc?hc/2.54:0;let ft=i?Math.floor(i/12):'',inch=i?Math.round(i-ft*12):'';if(inch===12){ft++;inch=0}
    return {ft:String(ft),inch:String(inch),lb:wk?String(Math.round(wk*2.20462*10)/10):'',cm:hc?String(Math.round(hc*10)/10):'',kg:wk?String(Math.round(wk*10)/10):''}};
  const [raw,setRaw]=useState(()=>toRaw(Number(f.heightCm)||0,Number(f.weightKg)||0));
  const setR=(k,v)=>setRaw(r=>({...r,[k]:v}));
  const measured=()=>imp
    ?{heightCm:(Number(raw.ft)||Number(raw.inch))?Math.round(((Number(raw.ft)||0)*12+(Number(raw.inch)||0))*2.54*100)/100:'',weightKg:Number(raw.lb)>0?Math.round(Number(raw.lb)/2.20462*1000)/1000:''}
    :{heightCm:Number(raw.cm)>0?Number(raw.cm):'',weightKg:Number(raw.kg)>0?Number(raw.kg):''};
  const switchUnits=u=>{const m=measured();setRaw(toRaw(Number(m.heightCm)||0,Number(m.weightKg)||0));set('units',u)};
  const save=()=>{if(!f.name.trim()){toast('Add a name first.');return}const id=c?c.id:uid();
    api.put('clients',id,{plan:{commitMonths:6,perWeek:3,rate:0,rateUnit:'session',billing:'pack',packSize:12,method:'invoice',rateType:'standard',startDate:f.startDate},...f,...measured(),name:f.name.trim(),created:f.created||Date.now()});
    const prev=(c&&c.partnerId)||'',next=f.partnerId||'';
    if(prev!==next){
      if(prev&&clients[prev]&&clients[prev].partnerId===id)api.put('clients',prev,{...clients[prev],partnerId:''});
      if(next&&clients[next]){const np=clients[next];if(np.partnerId&&np.partnerId!==id&&clients[np.partnerId])api.put('clients',np.partnerId,{...clients[np.partnerId],partnerId:''});api.put('clients',next,{...np,partnerId:id})}}
    toast(c?'Saved':'Athlete added');onSaved&&onSaved(id);onClose()};
  return html`<${Modal} title=${c?'Edit athlete':'New athlete'} onClose=${onClose} wide footer=${html`<span class="sp"></span><button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" onClick=${save}>${c?'Save':'Add athlete'}</button>`}>
    <div class="fgrid">
      <${Field} label="Full name" wide><input type="text" value=${f.name} onInput=${e=>set('name',e.target.value)}/><//>
      <${Field} label="Phone"><input type="tel" value=${f.phone} onInput=${e=>set('phone',e.target.value)}/><//>
      <${Field} label="Email"><input type="email" value=${f.email} onInput=${e=>set('email',e.target.value)}/><//>
      <${Field} label="Status"><select value=${f.status} onChange=${e=>set('status',e.target.value)}><option value="active">Active</option><option value="paused">Paused</option><option value="former">Former</option></select><//>
      <${Field} label="Athlete type"><select value=${f.athleteType} onChange=${e=>set('athleteType',e.target.value)}>${ATHLETE_TYPES.map(t=>html`<option value=${t}>${t}</option>`)}</select><//>
      ${f.athleteType==='Custom'&&html`<${Field} label="Custom type"><input type="text" value=${f.athleteCustom} onInput=${e=>set('athleteCustom',e.target.value)}/><//>`}
      <${Field} label="Trains with (partner)" hint="Booking one adds the other to the same slot."><select value=${f.partnerId||''} onChange=${e=>set('partnerId',e.target.value)}><option value="">Trains solo</option>${Object.values(clients).filter(x=>x.id!==(c&&c.id)&&(x.status||'active')!=='former').sort((a,b)=>a.name.localeCompare(b.name)).map(x=>html`<option value=${x.id}>${x.name}</option>`)}</select><//>
      <${Field} label="Date of birth" hint=${f.dob?`Age ${ageFrom(f.dob)}`:''}><input type="date" value=${f.dob} onInput=${e=>set('dob',e.target.value)}/><//>
      <${Field} label="Sex (for macro math)"><select value=${f.sex} onChange=${e=>set('sex',e.target.value)}><option value="male">Male</option><option value="female">Female</option></select><//>
      <${Field} label="Units"><select value=${f.units} onChange=${e=>switchUnits(e.target.value)}><option value="imperial">lb · ft/in</option><option value="metric">kg · cm</option></select><//>
      ${imp?html`<${Field} label="Height (ft / in)"><div style="display:flex;gap:6px"><input type="number" inputmode="numeric" min="0" value=${raw.ft} placeholder="ft" aria-label="Feet" onInput=${e=>setR('ft',e.target.value)}/><input type="number" inputmode="numeric" min="0" max="11" value=${raw.inch} placeholder="in" aria-label="Inches" onInput=${e=>setR('inch',e.target.value)}/></div><//>
        <${Field} label="Weight (lb)"><input type="number" inputmode="decimal" min="0" step="0.1" value=${raw.lb} placeholder="e.g. 180" onInput=${e=>setR('lb',e.target.value)}/><//>`
       :html`<${Field} label="Height (cm)"><input type="number" inputmode="decimal" min="0" value=${raw.cm} onInput=${e=>setR('cm',e.target.value)}/><//>
        <${Field} label="Weight (kg)"><input type="number" inputmode="decimal" min="0" step="0.1" value=${raw.kg} onInput=${e=>setR('kg',e.target.value)}/><//>`}
      <${Field} label="Client since"><input type="date" value=${f.startDate} onInput=${e=>set('startDate',e.target.value)}/><//>
      <${Field} label="Session balance adjustment" hint="Sessions they already have credit for when you add them here (use − to remove)."><input type="number" value=${f.sessionAdjust} onInput=${e=>set('sessionAdjust',Number(e.target.value)||0)}/><//>
      <${Field} label="Sessions done before this app" hint="Session numbering continues from here."><input type="number" min="0" value=${f.numberOffset} onInput=${e=>set('numberOffset',Number(e.target.value)||0)}/><//>
    </div>
  <//>`;
}

const fmtH=c=>{if(!c.heightCm)return null;if(c.units==='metric')return `${Math.round(c.heightCm)} cm`;const i=c.heightCm/2.54;let ft=Math.floor(i/12),inch=Math.round(i-ft*12);if(inch===12){ft++;inch=0}return `${ft}′${inch}″`};
const fmtW=c=>{if(!c.weightKg)return null;return c.units==='metric'?`${round2(c.weightKg)} kg`:`${Math.round(c.weightKg*2.20462)} lb`};

      <div class="pc-top"><span class="pc-sub num">${fmtTime(e.start)}–${fmtTime(e.start+(e.dur||60))}</span>
        <select style="width:auto;padding:5px 8px" value=${selVal(e,st)} onChange=${ev=>setStatus(e,ev.target.value)}>${Object.entries(STATUS_LABEL).map(([k,l])=>html`<option value=${k}>${l}</option>`)}</select></div>
      ${e.note&&html`<div class="pc-sub">${e.note}</div>`}</div>`}):html`<div class="empty">No sessions booked yet.</div>`}</div>
    <p class="fhint" style="margin:0">Cancellations outside your window return the credit, so a pushed session carries over.</p>`;
  return html`
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onClick=${openBook}><${Icon} n="cal"/>Book session</button><button class="btn" onClick=${openCharge}><${Icon} n="plus"/>Add sessions (top up)</button>
      <span class="sp" style="flex:1"></span><span class="muted" style="align-self:center;font-size:13.5px"><b class="num" style="color:var(--fg)">${s.remaining}</b> left · <b class="num" style="color:var(--fg)">${s.booked}</b> booked · <b class="num" style="color:var(--fg)">${s.unbooked}</b> not yet booked</span></div>
    <div class="panel tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Date</th><th>Time</th><th>Status</th><th>Note</th><th class="r">Left after</th></tr></thead><tbody>
      ${list.length?list.map(e=>{const info=infoOf(e);const st=info.st||'scheduled';
        return html`<tr><td class="num">${info.n?'#'+info.n:'—'}</td><td>${fmtDate(e.date)}${info.grp&&html` <span class="tag">With ${partners(e)}</span>`}</td><td class="num">${fmtTime(e.start)}</td>
          <td><select style="width:auto;padding:3px 6px;font-size:13px" value=${selVal(e,st)} onChange=${ev=>setStatus(e,ev.target.value)}>${Object.entries(STATUS_LABEL).map(([k,l])=>html`<option value=${k}>${l}</option>`)}</select></td>
          <td style="max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title=${e.note||''}>${e.note||html`<span class="muted">—</span>`}</td>

    </tbody></table></div>

function ListEditor({items,onChange,render:renderItem,blank,form,addLabel}){
  const [draft,setDraft]=useState(null);
  const save=()=>{const it={...draft};const arr=items.slice();const i=arr.findIndex(x=>x.id===it.id);if(i>=0)arr[i]=it;else arr.unshift(it);onChange(arr);setDraft(null)};
  return html`<div style="display:flex;flex-direction:column;gap:12px">
    ${draft?html`<div class="panel"><div class="panel-b" style="display:flex;flex-direction:column;gap:12px">${form(draft,(k,v)=>setDraft(d=>({...d,[k]:v})))}
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onClick=${()=>setDraft(null)}>Cancel</button><button class="btn primary" onClick=${save}>Save</button></div></div></div>`
     :html`<div><button class="btn primary" onClick=${()=>setDraft({...blank(),id:uid()})}><${Icon} n="plus"/>${addLabel}</button></div>`}
    <div class="panel"><div class="panel-b" style="padding-block:4px">${items.length?items.map(it=>html`<div class="entry">${renderItem(it)}<span class="acts"><button class="iconbtn" aria-label="Edit" onClick=${()=>setDraft({...it})}><${Icon} n="edit" s=${15}/></button><${IconDel} onConfirm=${()=>onChange(items.filter(x=>x.id!==it.id))}/></span></div>`):html`<div class="empty">Nothing here yet.</div>`}</div></div>
  </div>`;
}
