/* ===== Health / diabetes helpers ===== */
const DIAB_TYPES=[['','No diabetes'],['pre','Prediabetes'],['t1','Type 1 diabetes'],['t2','Type 2 diabetes'],['gest','Gestational diabetes'],['other','Other diabetes type']];
const DIAB_MEDS=[['insulin','Insulin (injections or pump)',true],['sulfonylurea','Sulfonylurea or meglitinide (e.g. gliclazide, glyburide, repaglinide)',true],
  ['sglt2','SGLT2 inhibitor (e.g. empagliflozin / Jardiance, dapagliflozin / Forxiga)',false],['glp1','GLP-1 or GIP/GLP-1 (e.g. semaglutide / Ozempic / Wegovy, tirzepatide / Mounjaro)',false],
  ['metformin','Metformin',false],['other','Other diabetes medication',false]];
const DIAB_COMPS=[['retinopathy','Retinopathy (diabetic eye disease)'],['neuropathy','Peripheral neuropathy (reduced feeling in feet)'],['autonomic','Autonomic neuropathy (heart rate / blood pressure)'],['kidney','Kidney disease'],['heart','Heart disease or high blood pressure']];
const diabRisk=c=>{const h=(c&&c.health)||{};const t=h.diabetes||'';if(!t)return {has:false};const meds=h.meds||[];
  const hypo=t==='t1'||meds.includes('insulin')||meds.includes('sulfonylurea');const lbl=(DIAB_TYPES.find(x=>x[0]===t)||[])[1]||'Diabetes';
  return {has:true,type:t,hypo,meds,cgm:!!h.cgm,comps:h.comps||[],label:lbl,short:[lbl,meds.includes('insulin')?'insulin':null,h.cgm?'CGM':null].filter(Boolean).join(' · ')}};
const Sec=({id,t,children})=>html`<section class="mg-sec" id=${id}><h3>${t}</h3>${children}</section>`;
const GuideToc=({items})=>html`<nav class="mg-toc">${items.map(([k,l])=>html`<a href=${'#'+k} onClick=${e=>{e.preventDefault();const el=document.getElementById(k);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}}>${l}</a>`)}</nav>`;
const Src=({items})=>html`<section class="mg-sec mg-src"><h3>Sources</h3><ul>${items.map(([t,u])=>html`<li><a href=${u} target="_blank" rel="noopener">${t}</a></li>`)}</ul></section>`;
const guideShell=(title,body,inline,onClose)=>inline?html`<div class="guide-doc">${body}</div>`
  :html`<${Modal} title=${title} onClose=${onClose} wide footer=${html`<span class="sp"></span><button class="btn primary" onClick=${onClose}>Done</button>`}>${body}<//>`;
const useScrollTo=section=>useEffect(()=>{if(section){const el=document.getElementById(section);if(el)setTimeout(()=>el.scrollIntoView({block:'start'}),60)}},[]);

/* ===== Diabetes guide ===== */
function DiabetesGuide({onClose,section,inline}){
  useScrollTo(section);
  const body=html`
    <${GuideToc} items=${[['dg-role','Your role'],['dg-before','Before they start'],['dg-t1','Type 1: session protocol'],['dg-low','Treating a low'],['dg-after','After training'],['dg-t2','Type 2 & prediabetes'],['dg-meds','Medications'],['dg-comps','Complications'],['dg-food','Nutrition & macros'],['dg-kit','Gym bag checklist']]}/>
    <div class="mg">
    <div class="callout u2">Exercise guidance only. Insulin and medication changes are always set by the athlete's diabetes care team (physician, endocrinologist or diabetes educator). Use their personal plan when it differs from the general numbers here.</div>
    <${Sec} id="dg-role" t="Your role as their coach">
      <ul><li>Programme training and give general nutrition guidance. Leave insulin doses, medication changes and carb-counting ratios to their care team.</li>
        <li>Get their consent to record health information. Ask for their <b>written hypo plan</b>: their low threshold, what they treat with, and where their glucagon is.</li>
        <li>Record it on the athlete's <b>Health</b> tab. Their calendar sessions then show a reminder.</li>
        <li>Ask for medical clearance before vigorous training if they're new to exercise, have complications (below), or have heart disease risk factors.</li></ul><//>
    <${Sec} id="dg-before" t="Before every session">
      <ul><li>Check glucose before starting: a fingerstick, or their CGM reading <b>and trend arrow</b>. A level that's dropping fast needs action even when the number looks fine.</li>
        <li>Know when they last ate and when their last rapid insulin dose was. Insulin taken in the 2 hours before training raises hypo risk the most.</li>
        <li>Fast carbs, their meter or phone, and water within reach for the whole session.</li></ul><//>
    <${Sec} id="dg-t1" t="Type 1 (and anyone on insulin): glucose before training">
      <p>From the international consensus on exercise in type 1 diabetes. Target range before starting is about <b>7–10 mmol/L</b>.</p>
      <div class="tbl-wrap"><table class="tbl mg-t"><thead><tr><th>Glucose before</th><th>What to do</th></tr></thead><tbody>
        <tr><td class="num"><b>Under 5.0</b></td><td>Don't start. Take 10–20 g fast carbs, recheck, and wait until it's above 5.0.</td></tr>
        <tr><td class="num"><b>5.0–6.9</b></td><td>Aerobic work: take about 10 g carbs first. Lifting, sprints and HIIT can usually start, because they tend to raise glucose.</td></tr>
        <tr><td class="num"><b>7.0–10.0</b></td><td>Go. This is the target range.</td></tr>
        <tr><td class="num"><b>10.1–15.0</b></td><td>Aerobic work can start. Lifting or HIIT can push glucose higher, so keep an eye on it.</td></tr>
        <tr><td class="num"><b>Over 15.0</b></td><td>If it's unexplained (not just a recent meal), check blood ketones. <b>0.6–1.4 mmol/L:</b> sort it out with their care plan before training. <b>1.5 or higher:</b> no exercise, follow their care plan or seek medical advice.</td></tr>
      </tbody></table></div>
      <ul><li><b>During long sessions:</b> check every ~30 minutes. Longer aerobic sessions often need carbs during exercise (commonly 15–30 g every 30 minutes, set with their care team based on their insulin).</li>
        <li><b>Session order:</b> lifting before cardio tends to keep glucose steadier than cardio first. A short all-out sprint (about 10 seconds) at the end of aerobic work can slow a fall.</li>
        <li><b>Stop</b> if glucose drops below 4.0 or they feel low. Treat, and only resume once they're back above 5.0 and feel normal.</li></ul><//>
    <${Sec} id="dg-low" t="Treating a low (below 4.0 mmol/L)">
      <ol><li>Stop training. Give <b>15 g fast-acting carbs</b>: 4 glucose tablets, ⅔ cup (150 mL) juice or regular pop, or 1 tbsp sugar or honey.</li>
        <li>Wait <b>15 minutes</b> and recheck. Still under 4.0? Give another 15 g. Repeat until it's 4.0 or higher.</li>
        <li>If their next meal is more than an hour away, give a snack with carbs and protein.</li>
        <li><b>Severe low</b> (confused, can't swallow safely, or unconscious): give nothing by mouth if they can't swallow. Put them on their side, give their glucagon if you're trained and it's available, and <b>call 9-1-1</b>. Stay with them.</li></ol>
      <p class="mg-note">Common symptoms: shaking, sweating, sudden hunger, fast heartbeat, dizziness, confusion, irritability, blurred vision, and a sudden drop in performance or coordination.</p><//>
    <${Sec} id="dg-after" t="After training">
      <ul><li>Glucose can keep dropping for <b>up to 24 hours</b>, especially overnight after long or new sessions, training on back-to-back days, or with alcohol.</li>
        <li>Encourage a meal or snack with carbs and protein after training, and a check before bed after hard sessions. Their care team may advise insulin changes on training days.</li>
        <li>Hard lifting or HIIT can raise glucose for a while afterwards. It usually settles, and they shouldn't over-correct without their care team's plan.</li></ul><//>
    <${Sec} id="dg-t2" t="Type 2 & prediabetes">
      <ul><li><b>Aerobic:</b> 150+ minutes a week of moderate to vigorous activity, spread over at least 3 days, with no more than 2 days in a row off.</li>
        <li><b>Resistance training:</b> 2–3 sessions a week on non-consecutive days, working all major muscle groups and progressing over time.</li>
        <li><b>Break up sitting:</b> a few minutes of light movement about every 30 minutes. Short walks after meals lower the rise in glucose after eating.</li>
        <li><b>Hypo risk is low</b> unless they use insulin or a sulfonylurea. If they do, follow the before-training and treating-a-low steps above.</li>
        <li><b>Prediabetes:</b> regular activity plus 5–7% weight loss (if they have weight to lose) sharply lowers the chance of developing type 2 diabetes.</li></ul><//>
    <${Sec} id="dg-meds" t="Medications that change your plan">
      <div class="tbl-wrap"><table class="tbl mg-t"><thead><tr><th>Medication</th><th>What it means for training and food</th></tr></thead><tbody>
        <tr><td><b>Insulin, sulfonylureas</b> (gliclazide, glyburide), meglitinides</td><td>Can cause lows. Check glucose around training and keep fast carbs ready. Carb changes such as low carb or carb cycling need their care team on board, because doses are matched to carbs.</td></tr>
        <tr><td><b>SGLT2 inhibitors</b> (Jardiance, Forxiga, Invokana)</td><td>Rarely cause lows on their own, but <b>keto or very low-carb diets raise the risk of ketoacidosis, even with normal glucose</b> (euglycemic DKA). Don't put them on low-carb or keto plans without their physician's OK. Keep them hydrated. Nausea, vomiting, belly pain or unusual tiredness need medical attention.</td></tr>
        <tr><td><b>GLP-1 / GIP-GLP-1</b> (Ozempic, Wegovy, Mounjaro, Zepbound)</td><td>Low appetite, so 20–50% of the weight lost can be lean mass if nothing is done about it. Prioritise <b>resistance training 2–3×/week</b> with progression, protein at every meal (at least ~1.2–1.5 g/kg, or 60–75 g a day as a floor), small protein-first meals, fluids and fibre.</td></tr>
        <tr><td><b>Metformin</b></td><td>Rarely causes lows on its own. Stomach upset is common when starting.</td></tr>
        <tr><td><b>Beta blockers</b> (often for blood pressure)</td><td>Hide the racing-heart warning sign of a low and blunt heart rate response. Use RPE instead of heart-rate zones.</td></tr>
      </tbody></table></div><//>
    <${Sec} id="dg-comps" t="Complications: training precautions">
      <div class="tbl-wrap"><table class="tbl mg-t"><thead><tr><th>Complication</th><th>Precautions</th></tr></thead><tbody>
        <tr><td><b>Retinopathy</b> (proliferative or severe)</td><td>Avoid heavy lifting, breath-holding and bracing (Valsalva), jumping, jarring movements and head-down positions until their eye doctor clears them. Use moderate loads with steady breathing.</td></tr>
        <tr><td><b>Peripheral neuropathy</b></td><td>Daily foot checks, well-fitted shoes and socks. No weight-bearing work with an open sore or ulcer: switch to bike, rower or pool. Add balance work.</td></tr>
        <tr><td><b>Autonomic neuropathy</b></td><td>Needs medical clearance. Heart rate response is blunted, so use RPE. Watch for dizziness on standing and with heat. Longer warm-ups and cool-downs.</td></tr>
        <tr><td><b>Kidney disease</b></td><td>Exercise is helpful. Avoid extreme blood-pressure spikes, and coordinate protein targets with their physician or dietitian.</td></tr>
        <tr><td><b>Heart disease / high BP</b></td><td>Medical clearance before vigorous work. Steady breathing on lifts. Stop for chest pain, unusual breathlessness or dizziness.</td></tr>
      </tbody></table></div><//>
    <${Sec} id="dg-food" t="Nutrition & macros">
      <ul><li><b>There is no single best macro split for diabetes</b> (Diabetes Canada and ADA). Build the plan around the person, their training and their medication.</li>
        <li><b>Type 1 athletes still need carbs that match their training.</b> Insulin gets adjusted to the food, not the other way round. Keep carb timing consistent and agree targets with their care team.</li>
        <li><b>Low-carb plans</b> are a valid option, but only with their care team involved. Doses of insulin or sulfonylureas may need to come down, and SGLT2 users face the ketoacidosis risk above.</li>
        <li><b>Carb cycling with insulin:</b> every day type needs a different insulin plan. Only use it if their care team is on board.</li>
        <li><b>Protein:</b> normal athlete targets apply unless they have kidney disease.</li>
        <li>The app flags these risks on the Macros tab when an athlete's Health tab lists diabetes.</li></ul><//>
    <${Sec} id="dg-kit" t="Gym bag checklist">
      <ul><li>Glucose tablets or gel, at least 30 g, plus juice boxes</li><li>A slower snack (granola bar, crackers and cheese)</li><li>Water</li>
        <li>Their meter, or their phone with the CGM app, and spare test strips</li><li>The location of their glucagon, and their emergency contact</li><li>Their written hypo plan (saved on their Health tab)</li></ul><//>
    <${Src} items=${[
      ['Riddell et al. (2017) Exercise management in type 1 diabetes: a consensus statement. Lancet Diabetes Endocrinol.','https://ddg.info/fileadmin/user_upload/Riddel_Exercise_Management_in_type_1_diabetes_Lancet_2017.pdf'],
      ['Abdulrahman et al. (2018) Use of CGM for sport in type 1 diabetes. BMJ Open Sport Exerc Med','https://pmc.ncbi.nlm.nih.gov/articles/PMC6350713/'],
      ['HealthLink BC: Treating low blood sugar','https://www.healthlinkbc.ca/healthwise/treating-low-blood-sugar'],
      ['Diabetes Canada: Low-carbohydrate diets for adults with diabetes','https://diabetes.ca/advocacy---policies/our-policy-positions/low-carbohydrate-diets-for-adults-with-diabetes--summary'],
      ['ADA Standards of Care in Diabetes 2026 (summary of updates)','https://www.patientcareonline.com/view/ada-publishes-2026-standards-of-care-with-updates-to-sections-on-technology-obesity-cardiometabolic-disease-management'],
      ['Colberg et al. (2016) Physical activity/exercise and diabetes: ADA position statement (key points)','https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5317029/'],
      ['ukactive (2025) GLP-1 medications and muscle mass preservation','https://www.ukactive.com/wp-content/uploads/2025/12/GLP-1-medications-and-muscle-mass-preservation.-Implications-and-recommendations.pdf'],
      ['Very low-carbohydrate diet and SGLT2 inhibitors: ketoacidosis risk','https://research.regionh.dk/da/publications/very-low-carbohydrate-diet-and-sglt-2-inhibitor-double-jeopardy-i/']]}/>
    </div>`;
  return guideShell('Diabetes & training',body,inline,onClose);
}

/* ===== Elite athlete training guide ===== */
function EliteGuide({onClose,section,inline}){
  useScrollTo(section);
  const T=({head,rows})=>html`<div class="tbl-wrap"><table class="tbl mg-t"><thead><tr>${head.map(h=>html`<th>${h}</th>`)}</tr></thead><tbody>${rows.map(r=>html`<tr>${r.map((c,i)=>html`<td class=${i===0?'mg-first':''}>${c}</td>`)}</tr>`)}</tbody></table></div>`;
  const body=html`
    <${GuideToc} items=${[['eg-year','Year plan'],['eg-dose','Training doses'],['eg-power','Speed & power'],['eg-conc','Strength + conditioning'],['eg-inseason','In season'],['eg-taper','Peaking & taper'],['eg-inj','Injury prevention'],['eg-mon','Monitoring'],['eg-rec','Recovery & fuel'],['eg-supp','Supplements'],['eg-women','Female athletes & REDs'],['eg-youth','Youth'],['eg-pl','Powerlifting'],['eg-hockey','Hockey'],['eg-fb','Football'],['eg-soccer','Soccer'],['eg-vb','Volleyball']]}/>
    <div class="mg">
    <${Sec} id="eg-year" t="Build the year backwards from competition">
      <p>Start with a needs analysis: the sport's demands, the position, the athlete's injury history and training age, and their testing results (strength, jumps, sprints, conditioning). Then plan backwards from the competitions that matter.</p>
      <${T} head=${['Phase','Main goal','What it looks like']} rows=${[
        ['Off-season, general (4–8 wk)','Rebuild work capacity, muscle, address weak links','Higher volume, 6–12 reps, 1–4 RIR. Unilateral work, tendon and injury-prevention work, aerobic base.'],
        ['Off-season, strength (4–8 wk)','Raise max strength','3–6 reps at 75–90%, 2–4 RIR. Fewer accessories.'],
        ['Pre-season (4–6 wk)','Turn strength into speed and power; sport conditioning','Jumps, throws, Olympic-lift variations, max-velocity sprinting, repeated-sprint and game-specific conditioning. Strength volume drops, intensity stays.'],
        ['In season','Keep strength and power, stay healthy','1–2 short sessions a week, heavy and low volume, planned around games.'],
        ['Transition (1–3 wk)','Recover physically and mentally','Active rest, other sports, light training.']]}/>
      <p class="mg-note">No single periodization model (linear, block or undulating) clearly beats the others in research. What matters is planned variation, progressive overload, and managing fatigue so the athlete peaks when it counts. Block periodization suits athletes who need to peak for set dates. Daily undulating works well for lifters in long off-seasons.</p><//>
    <${Sec} id="eg-dose" t="Training doses (most recent evidence)">
      <${T} head=${['Goal','Load / reps','Effort','Volume']} rows=${[
        ['Muscle (hypertrophy)','Anything from ~5 to 30 reps works. 6–15 is the practical sweet spot.','0–3 reps in reserve. Closer to failure gives more growth (Robinson 2024).','~10–20 hard sets per muscle per week. Gains keep rising with volume but level off. Per session, returns fade past roughly 6–11 sets per muscle.'],
        ['Max strength','1–6 reps at 80–95%+','2–4 RIR. Going to failure adds no extra strength (Robinson 2024).','A few heavy sets per lift per session. Strength returns fade sooner than muscle returns (about 2 direct sets per session gets most of the benefit; Remmert 2025).'],
        ['Power','Ballistic: 0–60% (jumps, throws). Olympic lifts: 70–90%.','Every rep at maximal intent. Stop the set when speed drops (about 10–20% velocity loss).','3–6 reps × 3–6 sets, full rest (2–5 min).'],
        ['Tendons / injury resilience','Heavy slow resistance (3 s up, 3 s down) and long isometric holds','Hard but pain-controlled','2–3×/week, mostly in the off-season']]}/>
      <ul><li>Rest 2–3+ minutes between heavy compound sets. Short rests cost strength and muscle on big lifts.</li>
        <li>Train each muscle or movement at least twice a week. When volume is equal, frequency matters little, so pick whatever fits the schedule.</li>
        <li>Use RPE/RIR, or bar velocity if you have the tech, so loads adjust on bad days.</li></ul><//>
    <${Sec} id="eg-power" t="Speed, plyometrics & power">
      <ul><li><b>Sprint</b> 2×/week: accelerations (10–30 m) and, for field sports, max-velocity runs (30–60 m) with full recovery (about 1 min per 10 m). Regular exposure to top speed also protects hamstrings.</li>
        <li><b>Plyometrics</b> 2–3×/week. Progress from landings and low-intensity hops to bounds and depth jumps. Count foot contacts, and cut them when the athlete is also doing lots of sport jumping (volleyball, basketball).</li>
        <li>Put speed and power work <b>first</b> in a session, when the athlete is fresh.</li>
        <li><b>Contrast or complex pairs</b> (a heavy set followed by a jump or sprint) work well for trained athletes in pre-season.</li></ul><//>
    <${Sec} id="eg-conc" t="Mixing strength and conditioning">
      <p>A 2022 meta-analysis of 43 studies found that combining aerobic and strength training <b>doesn't reduce muscle growth or max strength</b>, but it <b>does reduce explosive strength</b>, mainly when both are done in the same session.</p>
      <ul><li>For power athletes, separate hard conditioning and lifting by <b>3+ hours</b>, or put them on different days.</li>
        <li>When they must share a session, do the higher-priority quality first.</li>
        <li>Prefer cycling or sport-specific conditioning over high-volume running in heavy strength blocks. Match the conditioning to the sport's work-to-rest pattern (for example, hockey shifts are about 40–50 s on with 2–4 min off).</li></ul><//>
    <${Sec} id="eg-inseason" t="In season">
      <ul><li><b>Once a week</b> of heavy strength work keeps strength for at least 12 weeks. Every second week lost about 10% (Rønnestad 2011). Two short sessions a week are better when the schedule allows.</li>
        <li>Keep <b>intensity high and volume low</b>: 2–3 sets of 2–5 reps at 80–90%, plus a jump or throw. Sessions of 30–45 minutes.</li>
        <li>Avoid big eccentric work (heavy Nordics, high-volume lowering) within 48 hours of games.</li>
        <li>Plan around games with the <b>match-day (MD) model</b>:</li></ul>
      <${T} head=${['Day','Focus']} rows=${[['MD+1','Recovery: mobility, light bike or pool, soft tissue'],['MD+2','Off, or light upper body for non-starters'],['MD−4','Heaviest strength day (lower body emphasis)'],['MD−3','Conditioning / high-speed running, upper-body strength'],['MD−2','Power: jumps, short sprints. Low volume, quality'],['MD−1','Primer: 15–20 min of activation, a few sprints or jumps. Nothing fatiguing.']]}/>
      <p>With 2 games a week, keep only the MD−2/−3 power and strength touch. Recovery comes first.</p><//>
    <${Sec} id="eg-taper" t="Peaking & taper">
      <ul><li>Taper for <b>1–3 weeks</b>. Cut training volume by about <b>40–60%</b> and <b>keep intensity</b> (heavy singles and doubles, fast sprints). Cutting intensity is what loses performance.</li>
        <li>In strength athletes, a ~50% drop in volume-load over 1–3 weeks raised squat, bench and total. An exponential (gradual) taper also raised the deadlift (Travis 2021).</li>
        <li>Last heavy session about 5–10 days out for powerlifters. Then 2–3 days of very light work or rest before competing.</li>
        <li>Team sports: lighten the week before key tournaments or playoffs, rather than tapering for every game.</li></ul><//>
    <${Sec} id="eg-inj" t="Injury prevention that works">
      <${T} head=${['Programme','Evidence','How to dose it']} rows=${[
        ['Nordic hamstring curls','Programs including them cut hamstring injuries by about 51% (van Dyk 2019 meta-analysis)','Off-season 2×/wk, building to 3 sets × 6–8. In season 1×/wk, 1–2 sets × 3–5. Not within 48 h of games.'],
        ['Copenhagen adductor','Cut groin problems by about 41% in soccer players (Harøy 2019)','3×/wk in pre-season, 1×/wk in season. Short-lever version to start.'],
        ['Neuromuscular warm-ups (FIFA 11+ style)','Fewer lower-limb and ACL injuries in team sports when done consistently','10–20 min before every practice: running drills, landing mechanics, single-leg balance, Nordics.'],
        ['Shoulder (volleyball, football, throwing)','Helps with overhead load tolerance','External rotation, scapular work and rotator cuff endurance 2–3×/wk.'],
        ['Tendons (patellar, Achilles)','Heavy slow resistance and isometrics for load tolerance','Off-season priority. Manage jump counts in season.']]}/>
      <p>Graded return to training after time off. Spikes in load after a break are a common pattern before injuries.</p><//>
    <${Sec} id="eg-mon" t="Monitoring">
      <ul><li><b>Session RPE × minutes</b> gives a simple training-load number. Track week-to-week changes and avoid big jumps.</li>
        <li><b>Daily wellness check-in</b> (1–5 for sleep, soreness, fatigue, mood, stress). Act on trends, not single days.</li>
        <li><b>Countermovement jump</b> or bar speed at a fixed load as readiness checks. A clear drop from their normal suggests reducing volume that day.</li>
        <li>The acute:chronic workload ratio is <b>not a reliable injury predictor</b> (Impellizzeri 2020). Use load data for planning and communication, not as a red-light rule.</li></ul><//>
    <${Sec} id="eg-rec" t="Recovery & fuel">
      <ul><li><b>Sleep:</b> aim for 8+ hours in bed. Longer sleep has improved sprint and skill performance in athletes. Naps of 20–30 min help when nights are short.</li>
        <li><b>Protein:</b> 1.6–2.2 g/kg a day, in 4–5 meals of about 0.3–0.4 g/kg, including one before bed.</li>
        <li><b>Carbs</b> to match the training load: 3–5 g/kg for strength-focused days, 5–7 g/kg for team sport practice, 6–10 g/kg for heavy endurance or tournaments. Use the Macro setup guide.</li>
        <li><b>Cold-water immersion</b> right after strength sessions can blunt muscle and strength gains. Save it for congested game schedules, when recovering quickly matters more than adapting.</li>
        <li>Hydration: start sessions hydrated. Weighing before and after hot sessions shows sweat losses.</li></ul><//>
    <${Sec} id="eg-supp" t="Supplements with strong evidence (adults)">
      <${T} head=${['Supplement','Dose','Best for']} rows=${[
        ['Creatine monohydrate','3–5 g a day, every day (optional loading: 20 g/day for 5–7 days)','Strength, power, repeated sprints, muscle gain'],
        ['Caffeine','3–6 mg/kg about 60 min before. Lower doses (~2–3 mg/kg) also work. Over 9 mg/kg means more side effects.','Most sports. Avoid late-day doses that hurt sleep.'],
        ['Beta-alanine','3.2–6.4 g/day in split doses for 4+ weeks','Efforts of 1–4 minutes'],
        ['Nitrate (beetroot juice)','About 6–8 mmol, 2–3 h before','Endurance and repeated high-intensity efforts'],
        ['Sodium bicarbonate','0.2–0.3 g/kg, 1–3 h before (stomach upset is common)','High-intensity efforts of 1–7 minutes'],
        ['Vitamin D','Test levels. Supplement if low, which is common in Canadian winters','Bone health, general health']]}/>
      <p>Drug-tested athletes should only use <b>third-party tested</b> products (NSF Certified for Sport or Informed Sport). Under 18: food first. Most sporting bodies don't recommend performance supplements for youth athletes.</p><//>
    <${Sec} id="eg-women" t="Female athletes & REDs">
      <ul><li>Current evidence <b>doesn't support planning training around menstrual cycle phase</b> (Colenso-Semple 2023 umbrella review). Program for the individual, and let athletes track symptoms so you can adjust on days when they're affected.</li>
        <li><b>Relative energy deficiency in sport (REDs)</b> affects all sexes (IOC 2023). Not eating enough, especially not enough carbs, harms bone health, hormones, immunity, mood and performance.</li>
        <li>Warning signs: missed or irregular periods, stress fractures, frequent illness, falling performance despite training, constant fatigue, rapid weight change, and preoccupation with food or weight. Refer to a sports physician or dietitian.</li></ul><//>
    <${Sec} id="eg-youth" t="Youth athletes">
      <ul><li>Resistance training is safe and recommended for youth when it's supervised with good technique. Master the movement before adding load.</li>
        <li>Develop all-round athleticism (sprinting, jumping, landing, throwing, strength) before specialising.</li>
        <li>Watch total load from multiple teams and sports, and around growth spurts, when injury risk rises.</li>
        <li>Fuel for growth: no cuts or deficits, and regular meals and snacks around training.</li></ul><//>
    <${Sec} id="eg-pl" t="Powerlifting: 12–16 week meet prep">
      <${T} head=${['Block','Weeks','Main lifts','Accessories']} rows=${[
        ['Accumulation','4–6','Squat, bench and deadlift 2–3×/wk (bench up to 3–4). 3–5 sets × 5–8 at 65–80%, RPE 6–8. Include variations (pause, tempo, close-grip).','10–20 hard sets per muscle per week. Upper back, triceps, quads, hamstrings, glutes.'],
        ['Intensification','4–6','3–6 reps at 75–90%, RPE 7–9. Competition-style lifts take priority.','Volume down about a third'],
        ['Realization / peak','2–4','Singles and doubles at 90–100%. Practise commands and openers. Openers ≈ a weight they could triple on a normal day.','Minimal'],
        ['Taper','1–2','Volume down about 50%, intensity kept. Last heavy single about 7–10 days out. 2–3 days off or very light before the meet.','None']]}/>
      <p>Make weight early: water-cutting more than a small amount hurts strength. If they're well over the class limit, use a slow cut weeks out, not a hard cut in the last week.</p><//>
    <${Sec} id="eg-hockey" t="Hockey">
      <${T} head=${['Off-season day','Session']} rows=${[
        ['Day 1 · Lower strength','Accelerations 4–6 × 10–20 m. Trap bar or front squat 4×3–5, rear-foot-elevated split squat 3×6, Nordics, Copenhagen'],
        ['Day 2 · Upper strength','Med ball rotational throws. Bench or landmine press, pull-ups, rows, rotator cuff, anti-rotation core'],
        ['Day 3 · Lower power','Lateral bounds, skater jumps, box jumps. Hang power clean 4×3, single-leg RDL, hip adduction and abduction strength'],
        ['Day 4 · Upper + conditioning','Push and pull strength. Repeated-sprint bike: 8–12 × 30–45 s hard with 1:3–1:4 rest']]}/>
      <p>In season: 2 × 30–40 min sessions on MD−3/−4 and MD−2 (heavy low volume, plus jumps), groin and hip work, and recovery after games. Priorities: hip mobility, adductor strength and lateral power.</p><//>
    <${Sec} id="eg-fb" t="Football">
      <${T} head=${['Off-season day','Session']} rows=${[
        ['Day 1 · Lower power/strength','Starts and accelerations 6–8 × 10–20 yd. Power clean 5×3, back squat 4×3–5, RDL, sled push'],
        ['Day 2 · Upper strength','Bench 4×3–5, weighted pull-up, push press, rows, neck and shoulder work'],
        ['Day 3 · Speed + lower','Flying 20s or 30–40 yd builds. Jump squats, single-leg strength, Nordics'],
        ['Day 4 · Upper hypertrophy + conditioning','8–12 rep pressing and pulling. Position-specific conditioning: short sprints at a 1:5–1:10 work-to-rest ratio']]}/>
      <p>Linemen: more max strength and muscle, short-burst conditioning. Skill positions: more max velocity and change of direction. In season (Saturday game): Sunday recovery, Monday heavy total-body lift, Wednesday short power lift, Friday walkthrough only.</p><//>
    <${Sec} id="eg-soccer" t="Soccer">
      <ul><li><b>Off-season:</b> 2–3 strength sessions a week (squat or trap bar, split squats, hip thrusts, Nordics, Copenhagen). Sprint 2×/week including max velocity. Build the aerobic base with intervals (for example 4 × 4 min hard).</li>
        <li><b>In season:</b> follow the match-day model above. Nordics and Copenhagen 1×/week. Make sure every player hits close to top speed at least once a week, especially bench players.</li>
        <li><b>Congested fixtures</b> (2 games a week): drop strength to one short touch, and prioritise recovery and fuelling.</li></ul><//>
    <${Sec} id="eg-vb" t="Volleyball">
      <ul><li><b>Track jump load.</b> Practices can involve hundreds of jumps, so cut plyometric volume in the gym to match.</li>
        <li><b>Strength:</b> squat or trap bar, split squats, RDLs, calf and tibialis work. Heavy slow resistance and isometrics for patellar tendons in the off-season.</li>
        <li><b>Shoulders:</b> external rotation, scapular control and thoracic mobility 2–3×/week. Manage serving and spiking volume after time off.</li>
        <li><b>Landing mechanics</b> (knees over toes, soft landings, both legs) in every warm-up. Ankle balance work prevents repeat sprains.</li>
        <li>In season: 2 × 30–45 min per week, heavy and low volume, plus shoulder care.</li></ul><//>
    <${Src} items=${[
      ['Robinson et al. (2024) Proximity to failure: hypertrophy vs strength. Sports Med (summary)','https://www.fau.edu/newsdesk/articles/muscle-growth-strength-study'],
      ['Remmert, Pelland et al. (2025) Per-session volume, hypertrophy and strength (SportRxiv preprint)','https://sportrxiv.org/index.php/server/preprint/view/537'],
      ['Schumann et al. (2022) Compatibility of concurrent aerobic and strength training. Sports Med','https://researchonline.jcu.edu.au/71546/1/Schumann2021_Article_CompatibilityOfConcurrentAerob.pdf'],
      ['van Dyk et al. (2019) Nordic hamstring exercise and hamstring injuries. BJSM','https://bjsm.bmj.com/content/53/21/1362'],
      ['Travis et al. (2021) Step vs exponential taper in strength athletes. Front Physiol','https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2021.735932/pdf'],
      ['Resistance training frequency in trained athletes, incl. Rønnestad in-season maintenance. Sports Med (2021)','https://link.springer.com/article/10.1007/s40279-021-01460-7'],
      ['Impellizzeri et al. (2020) Acute:chronic workload ratio: conceptual issues. Front Physiol','https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2020.01034/pdf'],
      ['ISSN position stand: caffeine and exercise performance (2021)','https://pmc.ncbi.nlm.nih.gov/articles/PMC7777221/'],
      ['Colenso-Semple et al. (2023) Menstrual cycle and training: umbrella review (summary)','https://www.mysportscience.com/post/no-evidence-to-adapt-training-to-the-phase-of-the-menstrual-cycle'],
      ['IOC (2023) Consensus statement on REDs. Br J Sports Med','https://pubmed.ncbi.nlm.nih.gov/37752011/']]}/>
    </div>`;
  return guideShell('Elite athlete training',body,inline,onClose);
}

const GUIDE_LIST=[['elite','Elite athlete training','Year planning, training doses, in-season, tapering, injury prevention, monitoring, supplements, and plans for powerlifting, hockey, football, soccer and volleyball.','trophy'],
  ['macro','Macro setup','Protein, fat and carb targets, carb levels, phases, reverse diets and carb cycling.','apple'],
  ['diabetes','Diabetes & training','Glucose checks before sessions, treating lows, type 2, medications, complications and nutrition.','drop']];
function GuidesPage({ctx}){

}

function HealthTab({c,upd}){
  const h=c.health||{};const [g,setG]=useState(null);
  const save=p=>upd({health:{...h,...p}});
  const tog=(key,v)=>{const s=new Set(h[key]||[]);s.has(v)?s.delete(v):s.add(v);save({[key]:[...s]})};
  const r=diabRisk(c);
  return html`
    <div class="callout">Record health details only with the athlete's consent. Their care team sets medication and insulin decisions. This tab is for training safety.</div>

}

const RATIO_PRESETS=[
  {v:'keto',l:'Keto / very low carb',p:25,c:5,f:70,who:'Rarely the right call for strength or sport performance. Only for general-population clients who prefer it and train lightly.'},
  {v:'low',l:'Low carb',p:35,c:25,f:40,who:'General population fat loss, clients who feel better on fewer carbs, low-activity days.'},
  {v:'moderate',l:'Moderate carb',p:30,c:40,f:30,who:'The default for most lifters and general-population clients.'},
  {v:'high',l:'High carb',p:25,c:50,f:25,who:'Team-sport athletes in season, high-volume blocks, powerlifting peaks, bodybuilders in a gain.'},
  {v:'vhigh',l:'Very high carb (endurance)',p:20,c:60,f:20,who:'HYROX, endurance work, two-a-days, tournaments.'}];
const macroPct=x=>{const p=(Number(x.p)||0)*4,c=(Number(x.c)||0)*4,f=(Number(x.f)||0)*9;const t=p+c+f;if(!t)return {p:0,c:0,f:0};

const ratioText=x=>{const r=macroPct(x);return `${r.p}/${r.c}/${r.f}`};

    <nav class="mg-toc">${[['order','Order of operations'],['protein','Protein'],['fat','Fat'],['carbs','Carbs'],['levels','Carb levels'],['phases','Phases & rates'],['reverse','Reverse diets'],['cycling','Carb cycling'],['adjust','Adjusting'],['care','Juniors & red flags']].map(([k,l])=>html`<a href=${'#mg-'+k} onClick=${e=>{e.preventDefault();const el=document.getElementById('mg-'+k);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}}>${l}</a>`)}</nav>

    <${S} id="protein" t="Protein">

    <${S} id="carbs" t="Carbs">

        <tr><td>Light training, general population</td><td class="num">2–3 g/kg</td></tr>
        <tr><td>Strength training ~1 hr/day</td><td class="num">3–5 g/kg</td></tr>
        <tr><td>High-volume lifting, team sport practice</td><td class="num">5–7 g/kg</td></tr>
        <tr><td>Endurance / HYROX / two-a-days</td><td class="num">6–10 g/kg</td></tr></tbody></table>
      <p>The editor shows g/kg for each macro so you can check them against these ranges.</p><//>
    <${S} id="levels" t="Carb levels (ratio presets)">

      <table class="tbl mg-t"><thead><tr><th>Phase</th><th>Aim for</th></tr></thead><tbody>
        <tr><td>Cut</td><td>Lose 0.5–1% of bodyweight a week. Leaner athletes stay near 0.5%.</td></tr>

        <tr><td>Lean gain</td><td>Gain 0.25–0.5% a week. Beginners can go a bit faster, advanced lifters slower.</td></tr>
        <tr><td>Diet break</td><td>1–3 weeks at maintenance after 8–12+ weeks of cutting, then go back to the cut.</td></tr></tbody></table><//>
    <${S} id="reverse" t="Reverse diets">
      <ul><li>Start from the calories they ended the cut on.</li>
        <li>Add <b>50–100 kcal a week</b> (or every 2 weeks), mostly from carbs. Protein stays the same.</li>

        <li>Stop at the estimated maintenance, or earlier if weight has settled and hunger is under control.</li></ul><//>
    <${S} id="cycling" t="Setting up carb cycling">
      <ol>
        <li><b>Set the weekly average first.</b> Build the plan's calories and macros as normal, using the phase, protein, fat and carb level above. Carb cycling moves carbs around within the week. It doesn't change the weekly total.</li>

          <ul><li><b>High:</b> the hardest, highest-volume days. Lower body, heavy main lifts, games, hard practices, HYROX simulations.</li>
            <li><b>Medium:</b> moderate sessions. Upper body, technique work, lighter conditioning.</li>
            <li><b>Low:</b> rest days, recovery, easy cardio.</li>
            <li><b>Refeed:</b> during long cuts, 1 day every 1–2 weeks with carbs well up and fat down, roughly at maintenance.</li></ul></li>

    <${S} id="adjust" t="Adjusting a plan">
      <ul><li>Use the <b>weekly average</b> of 3–7 weigh-ins, not single days.</li>
        <li>Change by <b>100–200 kcal</b> at a time, mostly from carbs (or fat on a low-carb plan), and wait <b>2 weeks</b> before the next change.</li>

    <${S} id="care" t="Juniors & red flags">

        <li><b>Refer out</b> to a registered dietitian or physician for medical conditions (diabetes, kidney disease, GI conditions), pregnancy, or clients on medications that affect appetite or weight.</li>
        <li><b>Watch for warning signs of under-fuelling or disordered eating</b> (RED-S): rapid weight loss, missed periods, frequent illness or injury, constant fatigue, or obsession with food or weight. Pause the plan and refer.</li>
        <li>Check your province's scope-of-practice rules for trainers giving nutrition advice and meal plans. Keep plans as general guidance where needed.</li></ul><//>
    </div>`;
  return guideShell('Macro setup guide',body,inline,onClose);
}

const PHASES=[
  {g:'Fat loss',v:'cut-aggr',l:'Aggressive cut (−25%)',pct:-25},
  {g:'Fat loss',v:'cut',l:'Cut (−20%)',pct:-20},
  {g:'Fat loss',v:'cut-slow',l:'Slow cut (−10%)',pct:-10},
  {g:'Fat loss',v:'minicut',l:'Mini-cut, 2–6 weeks (−30%)',pct:-30,hint:'A short, hard cut, usually run after a gain phase. Keep it to 2–6 weeks.'},
  {g:'Maintenance & transitions',v:'maint',l:'Maintenance',pct:0},
  {g:'Maintenance & transitions',v:'reverse',l:'Reverse diet → maintenance (after a cut)',pct:0,step:true,hint:'Raises calories in small steps from where the cut ended, so weight and hunger settle before they reach maintenance. Protein stays the same, fat stays at the same % of calories, and the rest of each increase goes to carbs.'},
  {g:'Maintenance & transitions',v:'reverse-gain',l:'Reverse diet → lean gain',pct:5,step:true,hint:'Same stepped increases, but the end point is a lean gain (+5% over maintenance).'},
  {g:'Maintenance & transitions',v:'diet-break',l:'Diet break (maintenance for 1–3 weeks)',pct:0,weeks:true,hint:'A planned break at maintenance in the middle of a long cut. The plan notes when the break ends and what calories to go back to.'},
  {g:'Maintenance & transitions',v:'recomp',l:'Recomp (maintenance, high protein)',pct:0,protein:2.2,hint:'Calories at maintenance with protein raised to 2.2 g/kg.'},
  {g:'Muscle gain',v:'lean-gain',l:'Lean gain (+5%)',pct:5},
  {g:'Muscle gain',v:'gain',l:'Gain (+10%)',pct:10},
  {g:'Muscle gain',v:'fast-gain',l:'Fast gain (+15%)',pct:15},
  {g:'Other',v:'custom',l:'Custom % of maintenance',pct:null}];
const phaseOf=v=>PHASES.find(p=>p.v===v)||null;
const phaseFromPct=pct=>(PHASES.find(p=>p.pct===Number(pct)&&!p.step&&!p.weeks&&!p.protein&&p.v!=='minicut')||{}).v||'custom';
const splitMacros=(kcal,protG,fatPct)=>{const f=Math.round(kcal*fatPct/100/9);const c=Math.max(0,Math.round((kcal-protG*4-f*9)/4));return {kcal:Math.round(kcal),p:Math.round(protG),c,f}};
const buildSchedule=({start,target,step,every,startDate,protG,fatPct})=>{const rows=[];start=Number(start);target=Number(target);step=Math.max(10,Number(step)||100);every=Math.max(1,Number(every)||1);
  if(!(start>0)||!(target>0)||start>=target||!startDate)return rows;
  for(let k=0;k<52;k++){const kcal=Math.min(target,start+k*step);rows.push({wk:k*every+1,date:ymd(addDays(parseYmd(startDate),k*7*every)),...splitMacros(kcal,protG,fatPct)});if(kcal>=target)break}
  return rows};
const CYCLE_TYPES={high:{l:'High',r:1.5,fr:1},medium:{l:'Medium',r:1,fr:1},low:{l:'Low',r:0.5,fr:1.15},refeed:{l:'Refeed',r:2,fr:0.7}};
const CYCLE_PRESETS=[
  ['3h2m2l','3 high · 2 medium · 2 low',['high','low','medium','high','medium','high','low']],
  ['3h4l','3 high · 4 low (training / rest days)',['high','low','high','low','high','low','low']],
  ['2h3m2l','2 high · 3 medium · 2 low',['high','medium','low','high','medium','medium','low']],
  ['4h3l','4 high · 3 low',['high','high','low','high','low','high','low']],
  ['1r4m2l','1 refeed · 4 medium · 2 low',['medium','medium','low','medium','medium','refeed','low']],
  ['custom','Custom (set each day)',null]];
const WEEK_LBL=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const balanceCycle=(days,baseC,baseF)=>{const tot=sum(days,d=>CYCLE_TYPES[d].r)||7;const k=7*(Number(baseC)||0)/tot;
  const totF=sum(days,d=>CYCLE_TYPES[d].fr)||7;const kf=7*(Number(baseF)||0)/totF;const types={};
  Object.entries(CYCLE_TYPES).forEach(([key,t])=>{types[key]={c:Math.max(0,Math.round(k*t.r)),f:Math.round(kf*t.fr)}});return types};
const dayKcal=(p,t)=>Math.round((Number(p)||0)*4+(Number(t.c)||0)*4+(Number(t.f)||0)*9);
const cycleAvg=(p,cy)=>{const ds=cy.days.map(d=>cy.types[d]||{c:0,f:0});return {kcal:Math.round(sum(ds,t=>dayKcal(p,t))/7),c:Math.round(sum(ds,t=>Number(t.c)||0)/7),f:Math.round(sum(ds,t=>Number(t.f)||0)/7)}};
const curMacro=pl=>{if(!pl)return null;if(Array.isArray(pl.schedule)&&pl.schedule.length){const t=todayYmd();let i=0;pl.schedule.forEach((r,j)=>{if(r.date<=t)i=j});return {...pl,...pl.schedule[i],stepIdx:i,steps:pl.schedule.length}}
  if(pl.cycle&&pl.cycle.days){const di=(new Date().getDay()+6)%7;const type=pl.cycle.days[di];const t=pl.cycle.types[type]||{c:pl.c,f:pl.f};return {...pl,c:Number(t.c)||0,f:Number(t.f)||0,kcal:dayKcal(pl.p,t),dayType:type,dayIdx:di}}
  return pl};
const CycleWeek=({p,cy,today})=>html`<div class="cy-week">${cy.days.map((d,i)=>{const t=cy.types[d]||{};return html`<div class=${'cy-day cy-'+d+(i===today?' now':'')}>
  <span class="cy-dn">${WEEK_LBL[i]}</span><b>${CYCLE_TYPES[d]?CYCLE_TYPES[d].l:d}</b><span class="num">${dayKcal(p,t)}</span><small class="num">C${t.c} · F${t.f}</small><small class="num">${ratioText({p,c:t.c,f:t.f})}</small></div>`})}</div>`;
const ScheduleTable=({rows,cur})=>html`<div class="panel tbl-wrap"><table class="tbl"><thead><tr><th>Week</th><th>Starts</th><th class="r">kcal</th><th class="r">Protein</th><th class="r">Carbs</th><th class="r">Fat</th></tr></thead><tbody>
  ${rows.map((r,i)=>html`<tr class=${i===cur?'row-now':''}><td>${r.wk}${i===cur?html` <span class="pill u0" style="margin-left:4px">Now</span>`:''}</td><td>${fmtDate(r.date,{month:'short',day:'numeric'})}</td><td class="r num">${r.kcal}</td><td class="r num">${r.p}g</td><td class="r num">${r.c}g</td><td class="r num">${r.f}g</td></tr>`)}</tbody></table></div>`;

function MacrosTab({c,upd}){

  const startNew=()=>setEditing({id:uid(),name:'',startDate:todayYmd(),activity:1.55,phase:'maint',goalPct:0,protein:2.0,fatPct:25,kcal:'',p:'',c:'',f:'',notes:'',mealPlan:'',
    startKcal:prevKcal,stepKcal:100,stepEvery:1,targetKcal:'',breakWeeks:2});
  const saved=m.saved||[];
  const where=id=>m.active&&m.active.id===id?'active':saved.some(x=>x.id===id)?'saved':'new';
  const planName=pl=>pl.name||pl.phaseLabel||'Macro plan';
  const commit=(next,msg)=>{upd({macros:{active:m.active||null,saved,history:m.history||[],...next}});if(msg)toast(msg)};
  const activate=pl=>commit({active:{...pl,activeSince:todayYmd()},saved:[...(m.active?[m.active]:[]),...saved.filter(x=>x.id!==pl.id)]},`${planName(pl)} is now active`);
  const archive=pl=>{const h=[{...pl,endDate:todayYmd()},...(m.history||[])];if(m.active&&m.active.id===pl.id)commit({active:null,history:h},'Archived. No active plan right now.');else commit({saved:saved.filter(x=>x.id!==pl.id),history:h},'Archived to history')};
  const restore=pl=>{const {endDate,...rest}=pl;commit({saved:[rest,...saved],history:(m.history||[]).filter(x=>x.id!==pl.id)},'Restored to saved plans')};
  const editPlan=a=>{setEditing({stepKcal:100,stepEvery:1,breakWeeks:2,targetKcal:a.target||'',startKcal:a.schedule&&a.schedule[0]?a.schedule[0].kcal:'',...a,cycleOn:!!a.cycle,phase:a.phase||phaseFromPct(a.goalPct)})};
  const ph=editing?phaseOf(editing.phase):null;
  const pct=ph?(ph.pct==null?Number(editing.goalPct)||0:ph.pct):0;
  const calc=editing?calcMacros({w:wKg,h:Number(c.heightCm),age,sex:c.sex,activity:Number(editing.activity),goalPct:pct,protein:Number(editing.protein),fatPct:Number(editing.fatPct)}):null;
  const set=(k,v)=>setEditing(d=>({...d,[k]:v}));
  const setPhase=v=>setEditing(d=>{const p=phaseOf(v);const n={...d,phase:v};if(p&&p.protein)n.protein=p.protein;if(p&&p.pct!=null)n.goalPct=p.pct;if(p&&p.step&&!n.startKcal)n.startKcal=prevKcal;return n});

  const setPreset=v=>setEditing(d=>{const pr=CYCLE_PRESETS.find(x=>x[0]===v);const days=pr&&pr[2]?pr[2].slice():d.cycle.days;return {...d,cycle:{preset:v,days,types:balanceCycle(days,d.c,d.f)}}});

  const saveNew=makeActive=>{let plan={...editing,phaseLabel:ph?ph.l:'',goalPct:pct,weightKgAtStart:c.weightKg||null};

      ${(m.history||[]).length?(m.history||[]).map(h=>html`<div class="entry" style="flex-direction:column;gap:8px" key=${h.id}>

        ${open===h.id&&html`${PlanDetail(h)}<div><button class="btn sm danger" onClick=${()=>commit({history:m.history.filter(x=>x.id!==h.id)},'Removed from history')}>Remove from history</button></div>`}</div>`)

function PlanTab({ctx,c,s,upd,openCharge,openPay}){
  const p=c.plan||{};
  const setP=(k,v)=>upd({plan:{...p,[k]:v}});
  const meq=monthlyEq(p);
  const pkgs=pkgList(ctx.settings);
  const applyPkg=id=>{const k=pkgOf(ctx.settings,id);if(!k){upd({plan:{...p,packageId:''}});return}
    upd({plan:{...p,packageId:k.id,rate:Number(k.price)||p.rate||0,rateUnit:k.kind==='pack'?'session':'month',billing:k.kind==='pack'?'pack':'1',
      packSize:k.kind==='pack'?(Number(k.qty)||p.packSize):p.packSize,perWeek:Number(k.perWeek)||(k.kind==='monthly'&&Number(k.perMonth)>0?Math.round(Number(k.perMonth)/4.33*2)/2:p.perWeek),
      commitMonths:k.commit!=null?Number(k.commit):p.commitMonths,rateType:k.rateType||'standard'}});
    toast(`${k.name} applied. Change the rate here for custom pricing.`)};
  return html`<div class="panel"><div class="panel-h"><h3>Training plan</h3></div><div class="panel-b"><div class="fgrid">
      <${Field} label="Program" wide hint="Fills in the rate and billing. Change the rate below for legacy or custom pricing; purchases will use it."><select value=${p.packageId||''} onChange=${e=>applyPkg(e.target.value)}><option value="">Custom</option>${pkgOptions(ctx.settings)}</select><//>
      <${Field} label="Commitment (months)"><input type="number" min="0" value=${p.commitMonths??''} onChange=${e=>setP('commitMonths',num(e.target.value))}/><//>
      <${Field} label="Sessions per week"><input type="number" min="0" step="0.5" value=${p.perWeek??''} onChange=${e=>setP('perWeek',num(e.target.value))}/><//>
      <${Field} label="Plan start"><input type="date" value=${p.startDate||''} onChange=${e=>setP('startDate',e.target.value)}/><//>
      <${Field} label="Rate"><input type="number" min="0" step="0.01" value=${p.rate??''} onChange=${e=>setP('rate',num(e.target.value))}/><//>
      <${Field} label="Rate is per"><select value=${p.rateUnit||'session'} onChange=${e=>setP('rateUnit',e.target.value)}><option value="session">Session</option><option value="month">Month</option></select><//>
      <${Field} label="Rate type"><select value=${p.rateType||'standard'} onChange=${e=>setP('rateType',e.target.value)}>${Object.entries(RATE_TYPE_LABEL).map(([k,l])=>html`<option value=${k}>${l}</option>`)}</select><//>
      <${Field} label="Billing"><select value=${p.billing||'pack'} onChange=${e=>setP('billing',e.target.value)}>${Object.entries(BILLING_LABEL).map(([k,l])=>html`<option value=${k}>${l}</option>`)}</select><//>
      ${p.billing==='pack'&&html`<${Field} label="Pack size (sessions)"><input type="number" min="1" value=${p.packSize??''} onChange=${e=>setP('packSize',num(e.target.value))}/><//>`}
      <${Field} label="Pays by"><select value=${p.method||'invoice'} onChange=${e=>setP('method',e.target.value)}>${Object.entries(METHOD_LABEL).map(([k,l])=>html`<option value=${k}>${l}</option>`)}</select><//>
      <${Field} label="Rate note" wide><input type="text" value=${p.rateNote||''} placeholder="e.g. Grandfathered 2023 rate until renewal" onChange=${e=>setP('rateNote',e.target.value)}/><//>
      ${ctx.settings.gstRegistered&&!ctx.settings.gstIncluded&&html`<label class="check" style="grid-column:1/-1"><input type="checkbox" checked=${!p.noGst} onChange=${e=>setP('noGst',!e.target.checked)}/>Charge GST to this athlete <span class="muted">(untick for cash clients who don't pay GST)</span></label>`}
    </div>
    </div></div>
    ${(()=>{const st=ctx.settings;const months=Number(p.commitMonths)||0;const span=months||1;const rate=Number(p.rate)||0;const perW=Number(p.perWeek)||0;
      const perSess=p.rateUnit!=='month';const weeks=Math.round(WPM*span*100)/100;const sess=Math.round(perW*WPM*span);
      const sub=round2(perSess?rate*sess:rate*span);const gOn=st.gstRegistered&&!st.gstIncluded&&!p.noGst;const gr=(Number(st.gstRate)||0)/100;
      const g=round2(gOn?sub*gr:0);const tot=round2(sub+g);
      const since=p.startDate||'0000';const billed=sum((s.charges||[]).filter(ch=>ch.date>=since),ch=>ch.amount);const paid=sum((s.payments||[]).filter(x=>x.date>=since),x=>x.amount);
      return html`<div class="panel plan-total"><div class="panel-h"><h3>Plan total</h3><span class="sp"></span><span class="fhint">${months?`${months}-month commitment${s.termEnd?` · ends ${fmtDateY(s.termEnd)}`:''}`:'No commitment · one month shown'}</span></div>
        <div class="panel-b"><dl class="pt-lines num">
          ${perSess&&html`<dt>Sessions</dt><dd>${perW}×/week × ${weeks} weeks = <b>${sess} sessions</b></dd>
          <dt>Training</dt><dd>${sess} × ${money(rate)} = <b>${money(sub)}</b></dd>`}
          ${!perSess&&html`<dt>Training</dt><dd>${span} month${span===1?'':'s'} × ${money(rate)} = <b>${money(sub)}</b></dd>`}
          ${gOn&&html`<dt>GST ${st.gstRate}%</dt><dd>${money(g)}</dd>`}
          <dt class="pt-total">${months?'Plan total':'Monthly total'}</dt><dd class="pt-total">${money(tot)}</dd>
          ${months>1&&html`<dt>Per month</dt><dd>${money(round2(tot/months))} <span class="muted">(${money(round2(sub/months))} before GST)</span></dd>`}
          ${(billed>0||paid>0)&&html`<dt>Billed since start</dt><dd>${money(billed)} · paid ${money(paid)}${months&&billed<tot-0.01?html` · <span class="muted">${money(round2(tot-billed))} left to bill</span>`:''}</dd>`}
        </dl>
        <p class="fhint" style="margin:10px 0 0">A month counts as ${WPM===4?'4 weeks':'52 weeks ÷ 12 (about 4.33 weeks)'}. Change this in Setup under Programs & pricing.${!rate?' Set a rate above to see the total.':''}</p></div></div>`})()}
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onClick=${openCharge}><${Icon} n="plus"/>Record purchase / renewal</button><button class="btn" onClick=${openPay}><${Icon} n="wallet"/>Log payment</button>
      <span style="align-self:center;margin-left:auto">${s.active&&html`<${Pill} u=${s.urg}>${s.reason}<//>`}</span></div>
    <${LedgerTable} ctx=${ctx} clientId=${c.id}/>`;
}

/* ================= Payments ================= */
const pkgList=settings=>(settings&&settings.packages)||[];
const pkgOf=(settings,id)=>id?pkgList(settings).find(p=>p.id===id)||null:null;
const pkgPriceLabel=k=>`${money(k.price)}/${k.kind==='pack'?'session':'month'}`;
const pkgOptions=settings=>{const groups={};pkgList(settings).forEach(k=>{(groups[k.group||'Other']=groups[k.group||'Other']||[]).push(k)});
  return Object.entries(groups).map(([g,ks])=>html`<optgroup label=${g}>${ks.map(k=>html`<option value=${k.id}>${k.name} · ${pkgPriceLabel(k)}</option>`)}</optgroup>`)};
const pkgHint=k=>(k.includes?k.includes+'. ':'')+(k.kind==='pack'?'Sessions carry over until they are used.':Number(k.perMonth)>0?`${k.perMonth} sessions each month. Unused sessions don't carry over.`:'Flat monthly fee. No sessions to track.');

function ChargeModal({ctx,clientId,onClose,edit}){
  const {clients,derived,settings,api}=ctx;
  const [cid,setCid]=useState(clientId||'');
  const c=clients[cid];const p=(c&&c.plan)||{};const s=cid?derived.cs[cid]:null;
  const pkgs=pkgList(settings);
  const custom=()=>{const base={pkgId:'',qty:'',unit:'',expires:false,perMonth:0};if(!c)return {...base,sessions:0,months:0,amount:0,periodStart:todayYmd(),desc:''};
    const meq=monthlyEq(p);
    if(p.billing==='pack'){const n=Number(p.packSize)||10;return {...base,sessions:n,months:0,amount:round2(p.rateUnit==='month'?meq:(Number(p.rate)||0)*n),periodStart:todayYmd(),desc:`${n}-session pack`}}
    const m=Number(p.billing)||1;const start=(s&&s.paidThrough)||p.startDate||todayYmd();
    return {...base,sessions:Math.round(sessionsPerMonth(p)*m),months:m,amount:round2(meq*m),periodStart:start,desc:`${BILLING_LABEL[p.billing]||'Training'} · ${fmtDate(start,{month:'short',year:'numeric'})}`}};
  const monthDesc=(k,start,m)=>`${k.name} · ${fmtDate(start,{month:'short',year:'numeric'})}${m>1?` (${m} months)`:''}`;
  const fromPkg=k=>{
    const own=p.packageId===k.id&&Number(p.rate)>0;
    if(k.kind==='pack'){const n=Number(k.perWeek)?Math.round(Number(k.perWeek)*WPM):(Number(k.qty)||10);const price=own&&p.rateUnit!=='month'?Number(p.rate):Number(k.price)||0;
      return {pkgId:k.id,qty:n,unit:price,sessions:n,months:0,expires:false,perMonth:0,amount:round2(price*n),periodStart:todayYmd(),desc:`${k.name} · ${n} sessions`}}
    const pt=s&&s.paidThrough;const start=pt&&pt>=addMonthsYmd(todayYmd(),-1)?pt:todayYmd();
    const price=own&&p.rateUnit==='month'?Number(p.rate):Number(k.price)||0;const pm=Number(k.perMonth)||0;
    return {pkgId:k.id,qty:1,unit:price,sessions:pm,months:1,expires:pm>0,perMonth:pm,amount:round2(price),periodStart:start,desc:monthDesc(k,start,1)}};
  const initial=()=>{const k=pkgOf(settings,p.packageId);return k?fromPkg(k):custom()};
  const r0=(Number(settings.gstRate)||0)/100;
  const fromEdit=()=>({date:edit.date,dueDate:edit.dueDate&&edit.dueDate!==edit.date?edit.dueDate:'',method:edit.method||'invoice',desc:edit.desc||'',pkgId:'',qty:'',unit:'',
    sessions:Number(edit.sessions)||0,months:Number(edit.months)||0,periodStart:edit.periodStart||edit.date,expires:!!edit.expires,perMonth:Number(edit.perMonth)||0,paidNow:false,
    gst:!!edit.gst&&!!settings.gstRegistered&&!settings.gstIncluded,amount:edit.base!=null?edit.base:(edit.gst&&!settings.gstIncluded?round2(edit.amount/(1+r0)):edit.amount)});
  const [f,setF]=useState(()=>edit?fromEdit():({date:todayYmd(),gst:!!settings.gstRegistered&&!settings.gstIncluded&&!p.noGst,paidNow:false,method:p.method||'invoice',dueDate:'',...initial()}));
  useEffect(()=>{if(!clientId&&c)setF(x=>({...x,...initial(),method:p.method||'invoice',gst:!!settings.gstRegistered&&!settings.gstIncluded&&!p.noGst}))},[cid]);
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const pk=pkgOf(settings,f.pkgId);
  const choosePkg=id=>{const k=pkgOf(settings,id);setF(x=>({...x,...(k?fromPkg(k):custom())}))};
  const setQty=v=>setF(x=>{const k=pkgOf(settings,x.pkgId);if(!k)return x;const q=Number(v)||0;
    if(k.kind==='pack')return {...x,qty:v,sessions:q,amount:round2((Number(x.unit)||0)*q),desc:`${k.name} · ${q} sessions`};
    return {...x,qty:v,months:q,sessions:(Number(k.perMonth)||0)*q,amount:round2((Number(x.unit)||0)*q),desc:monthDesc(k,x.periodStart,q)}});
  const setUnit=v=>setF(x=>({...x,unit:v,amount:round2((Number(v)||0)*(Number(x.qty)||0))}));
  const setStart=v=>setF(x=>{const k=pkgOf(settings,x.pkgId);return {...x,periodStart:v,desc:k&&k.kind==='monthly'?monthDesc(k,v,Number(x.qty)||1):x.desc}});
  const r=(Number(settings.gstRate)||0)/100;
  const total=f.gst&&settings.gstRegistered&&!settings.gstIncluded?round2(Number(f.amount)*(1+r)):round2(Number(f.amount));
  const save=()=>{if(!c){toast('Pick an athlete.');return}
    if(edit){api.put('ledger',edit.id,{...edit,date:f.date,dueDate:f.dueDate||f.date,amount:total,base:round2(Number(f.amount)),gst:!!(settings.gstRegistered&&(f.gst||settings.gstIncluded)),
      sessions:f.expires?(Number(f.perMonth)||0)*(Number(f.months)||1):Number(f.sessions)||0,months:Number(f.months)||0,periodStart:f.periodStart||f.date,desc:f.desc||'',method:f.method,perMonth:Number(f.perMonth)||0});
      toast('Purchase updated');onClose();return}
    if(pk&&!(Number(f.qty)>0)){toast(pk.kind==='pack'?'Enter how many sessions.':'Enter how many months.');return}
    const id=uid();
    api.put('ledger',id,{clientId:cid,kind:'charge',date:f.date,dueDate:f.dueDate||f.date,amount:total,base:round2(Number(f.amount)),gst:!!(settings.gstRegistered&&(f.gst||settings.gstIncluded)),sessions:Number(f.sessions)||0,months:Number(f.months)||0,periodStart:f.periodStart||f.date,desc:f.desc||'',method:f.method,
      packageId:f.pkgId||'',expires:!!f.expires,perMonth:Number(f.perMonth)||0});
    if(f.paidNow)api.put('ledger',uid(),{clientId:cid,kind:'payment',date:f.date,amount:total,method:f.method,note:'Paid in full'});
    toast(`${Number(f.sessions)?`${Number(f.sessions)} sessions added · `:''}${money(total)} ${f.paidNow?'paid':'billed'}`);onClose()};
  const amountLabel=settings.gstRegistered&&!settings.gstIncluded?'Total before GST':'Total';
  return html`<${Modal} title=${edit?'Edit purchase':'Record purchase'} onClose=${onClose} footer=${html`<span class="sp"></span><button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" onClick=${save}>${edit?'Save changes':'Save'} · ${money(total)}</button>`}>
    ${edit&&html`<div class="callout">${c?c.name:''}${edit.packageId&&pkgOf(settings,edit.packageId)?` · ${pkgOf(settings,edit.packageId).name}`:''}. Changes here update their session balance and what they owe. Payments already logged stay as they are.</div>`}
    ${!clientId&&html`<${Field} label="Athlete"><select value=${cid} onChange=${e=>setCid(e.target.value)}><option value="">Choose…</option>${Object.values(clients).sort((a,b)=>a.name.localeCompare(b.name)).map(x=>html`<option value=${x.id}>${x.name}</option>`)}</select><//>`}
    ${!edit&&html`<${Field} label="Program" hint=${pk?pkgHint(pk):'Enter the sessions, months and amount yourself.'}><select value=${f.pkgId} onChange=${e=>choosePkg(e.target.value)}>${pkgOptions(settings)}<option value="">Custom purchase</option></select><//>`}
    ${pk&&!(Number(f.unit)>0)&&html`<div class="callout u2">No price set for ${pk.name}. Type it below, or set it once in Setup under Programs.</div>`}
    ${pk?html`<div class="fgrid">
        ${pk.kind==='pack'
          ?html`<${Field} label="Sessions"><input type="number" inputmode="numeric" min="1" value=${f.qty} onInput=${e=>setQty(e.target.value)}/><//>
            <${Field} label="Price per session"><input type="number" inputmode="decimal" min="0" step="0.01" value=${f.unit} onInput=${e=>setUnit(e.target.value)}/><//>`
          :html`<${Field} label="Months"><input type="number" inputmode="numeric" min="1" value=${f.qty} onInput=${e=>setQty(e.target.value)}/><//>
            <${Field} label="Monthly price"><input type="number" inputmode="decimal" min="0" step="0.01" value=${f.unit} onInput=${e=>setUnit(e.target.value)}/><//>
            <${Field} label="Covers from"><input type="date" value=${f.periodStart} onInput=${e=>setStart(e.target.value)}/><//>`}
        <${Field} label=${amountLabel}><input type="number" inputmode="decimal" min="0" step="0.01" value=${f.amount} onInput=${e=>set('amount',e.target.value)}/><//>
      </div>
      ${pk.kind==='monthly'&&Number(pk.perMonth)>0&&html`<p class="fhint" style="margin:0">Adds ${pk.perMonth} session${Number(pk.perMonth)===1?'':'s'} for each month, from ${fmtDate(f.periodStart,{month:'short',day:'numeric'})}. Any not used by the end of their month expire.</p>`}`
    :html`<div class="fgrid">
      ${f.expires?html`<${Field} label="Sessions per month" hint="Unused ones expire monthly"><input type="number" min="0" value=${f.perMonth} onInput=${e=>set('perMonth',e.target.value)}/><//>`
        :html`<${Field} label="Sessions added"><input type="number" min="0" value=${f.sessions} onInput=${e=>set('sessions',e.target.value)}/><//>`}
      <${Field} label="Months covered" hint="0 for session packs"><input type="number" min="0" value=${f.months} onInput=${e=>set('months',e.target.value)}/><//>
      ${Number(f.months)>0&&html`<${Field} label="Covers from"><input type="date" value=${f.periodStart} onInput=${e=>set('periodStart',e.target.value)}/><//>`}
      <${Field} label=${amountLabel}><input type="number" min="0" step="0.01" value=${f.amount} onInput=${e=>set('amount',e.target.value)}/><//>
    </div>`}
    <div class="fgrid">
      <${Field} label="Date"><input type="date" value=${f.date} onInput=${e=>set('date',e.target.value)}/><//>
      <${Field} label="Pay by"><select value=${f.method} onChange=${e=>set('method',e.target.value)}>${Object.entries(METHOD_LABEL).map(([k,l])=>html`<option value=${k}>${l}</option>`)}</select><//>
      <${Field} label="Due date" hint="Blank = due on the date above"><input type="date" value=${f.dueDate} onInput=${e=>set('dueDate',e.target.value)}/><//>
      <${Field} label="Description" wide><input type="text" value=${f.desc} onInput=${e=>set('desc',e.target.value)}/><//>
    </div>
    ${settings.gstRegistered&&!settings.gstIncluded&&html`<label class="check"><input type="checkbox" checked=${f.gst} onChange=${e=>set('gst',e.target.checked)}/>Add GST (${settings.gstRate}%) — total ${money(total)}</label>`}
    ${!edit&&html`<label class="check"><input type="checkbox" checked=${f.paidNow} onChange=${e=>set('paidNow',e.target.checked)}/>Paid in full now</label>`}
    <p class="fhint" style="margin:0">Leave "paid" unticked for invoices you're waiting on or cash they'll pay in parts.</p>
  <//>`;
}

function ProgramsPanel({settings,set}){
  const list=pkgList(settings);
  const upd=(i,patch)=>{const a=list.slice();a[i]={...a[i],...patch};set('packages',a)};
  return html`<div class="panel"><div class="panel-h"><h3>Programs & pricing</h3><span class="sp"></span><span class="fhint">Prices before GST. Pick these when you record a purchase.</span></div>
    <div class="panel-b" style="display:flex;flex-direction:column;gap:4px">
      <div class="fgrid" style="padding-bottom:6px;border-bottom:1px solid var(--line-2)"><${Field} label="Count a month as" hint="Used for plan totals and monthly session counts. 4 weeks: 2×/week = 8 sessions a month, 24 over 3 months. 52 ÷ 12: 26 over 3 months."><select value=${String(settings.weeksPerMonth||4)} onChange=${e=>set('weeksPerMonth',Number(e.target.value))}><option value="4">4 weeks</option><option value=${String(52/12)}>52 weeks ÷ 12 (≈4.33)</option></select><//></div>
      ${list.map((k,i)=>html`<div class="pkg-row" key=${k.id}>
        <${Field} label="Name"><input type="text" value=${k.name} onChange=${e=>upd(i,{name:e.target.value})}/><//>
        <${Field} label="Billed"><select value=${k.kind} onChange=${e=>upd(i,{kind:e.target.value})}><option value="pack">Per session</option><option value="monthly">Flat monthly rate</option></select><//>
        <${Field} label=${k.kind==='pack'?'Price / session':'Price / month'}><input type="number" inputmode="decimal" min="0" step="0.01" value=${k.price} onChange=${e=>upd(i,{price:Number(e.target.value)||0})}/><//>
        ${k.kind==='pack'
          ?html`<${Field} label="Sessions per purchase"><input type="number" inputmode="numeric" min="1" value=${k.qty} onChange=${e=>upd(i,{qty:Number(e.target.value)||1})}/><//>`
          :html`<${Field} label="Sessions / month" hint="0 = not tracked"><input type="number" inputmode="numeric" min="0" value=${k.perMonth} onChange=${e=>upd(i,{perMonth:Number(e.target.value)||0})}/><//>`}
        <div class="pkg-del"><${IconDel} onConfirm=${()=>set('packages',list.filter(x=>x.id!==k.id))}/></div>
        <label class="field pkg-hint"><span class="flabel">${k.group||'Other'} · What's included</span><input type="text" value=${k.includes||''} placeholder="Optional" onChange=${e=>upd(i,{includes:e.target.value})}/></label>
      </div>`)}
      <div style="padding-top:8px"><button class="btn sm" onClick=${()=>set('packages',[...list,{id:uid(),name:'New program',group:'Other',kind:'monthly',price:0,qty:10,perMonth:4}])}><${Icon} n="plus" s=${13}/>Add program</button></div>
    </div></div>`;
}

function PaymentModal({ctx,clientId,onClose,edit}){
  const {clients,derived,api}=ctx;
  const [cid,setCid]=useState(clientId||'');
  const s=cid?derived.cs[cid]:null;const c=clients[cid];
  const [f,setF]=useState(()=>edit?{date:edit.date,amount:edit.amount,method:edit.method||'cash',note:edit.note||''}:{date:todayYmd(),amount:s&&s.balance>0?s.balance:'',method:(c&&c.plan&&c.plan.method)||'cash',note:''});
  useEffect(()=>{if(!clientId&&s)setF(x=>({...x,amount:s.balance>0?s.balance:'',method:(c.plan&&c.plan.method)||'cash'}))},[cid]);
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const save=()=>{if(!c){toast('Pick an athlete.');return}if(!(Number(f.amount)>0)){toast('Enter an amount.');return}
    if(edit){api.put('ledger',edit.id,{...edit,date:f.date,amount:round2(Number(f.amount)),method:f.method,note:f.note});toast('Payment updated');onClose();return}
    api.put('ledger',uid(),{clientId:cid,kind:'payment',date:f.date,amount:round2(Number(f.amount)),method:f.method,note:f.note});
    const left=round2((s?s.balance:0)-Number(f.amount));toast(left>0?`Logged · ${money(left)} still owing`:'Logged · paid up');onClose()};
  return html`<${Modal} title=${edit?'Edit payment':'Log payment'} onClose=${onClose} footer=${html`<span class="sp"></span><button class="btn" onClick=${onClose}>Cancel</button><button class="btn primary" onClick=${save}>${edit?'Save changes':'Log payment'}</button>`}>
    ${!clientId&&html`<${Field} label="Athlete"><select value=${cid} onChange=${e=>setCid(e.target.value)}><option value="">Choose…</option>${Object.values(clients).sort((a,b)=>a.name.localeCompare(b.name)).map(x=>html`<option value=${x.id}>${x.name}</option>`)}</select><//>`}
    ${s&&!edit&&html`<div class=${'callout'+(s.balance>0?' u2':'')}>Current balance: <b class="num">${money(s.balance)}</b>${s.balance<0?' (credit)':''}</div>`}
    <div class="fgrid">
      <${Field} label="Amount received"><input type="number" min="0" step="0.01" value=${f.amount} onInput=${e=>set('amount',e.target.value)}/><//>
      <${Field} label="Date"><input type="date" value=${f.date} onInput=${e=>set('date',e.target.value)}/><//>
      <${Field} label="Method"><select value=${f.method} onChange=${e=>set('method',e.target.value)}>${Object.entries(METHOD_LABEL).map(([k,l])=>html`<option value=${k}>${l}</option>`)}</select><//>
      <${Field} label="Note" wide><input type="text" value=${f.note} placeholder="e.g. Cash at session, 2 of 3" onInput=${e=>set('note',e.target.value)}/><//>
    </div>
    <p class="fhint" style="margin:0">Payments are applied to the oldest unpaid charge first.</p>
  <//>`;
}

function LedgerTable({ctx,clientId}){
  const {ledger,clients,derived,api}=ctx;
  const [ed,setEd]=useState(null);
  const modalEl=ed?(ed.kind==='charge'?html`<${ChargeModal} ctx=${ctx} clientId=${ed.clientId} edit=${ed} onClose=${()=>setEd(null)}/>`:html`<${PaymentModal} ctx=${ctx} clientId=${ed.clientId} edit=${ed} onClose=${()=>setEd(null)}/>`):null;
  const rows=Object.values(ledger).filter(l=>!clientId||l.clientId===clientId).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  const chargeState={};Object.values(derived.cs).forEach(s=>(s.charges||[]).forEach(ch=>{chargeState[ch.id]=ch}));
  const markPaid=ch=>{const owe=round2(ch.amount-ch.paid);api.put('ledger',uid(),{clientId:ch.clientId,kind:'payment',date:todayYmd(),amount:owe,method:ch.method||'invoice',note:`Paid: ${ch.desc||'charge'}`});toast(`Marked paid · ${money(owe)}`)};
  if(ctx.isM)return html`<div class="panel cardlist">${rows.length?rows.map(l=>{const ch=chargeState[l.id];const owe=ch?round2(ch.amount-ch.paid):0;const c=clients[l.clientId];const pay=l.kind==='payment';
    return html`<div class="pcard" key=${l.id}>
      <div class="pc-top"><b>${pay?'Payment received':(l.desc||'Charge')}</b><span class="num" style=${pay?'color:var(--ok);font-weight:600':'font-weight:600'}>${pay?'−':''}${money(l.amount)}</span></div>
      <div class="pc-sub">${[fmtDate(l.date,{month:'short',day:'numeric',year:'2-digit'}),!clientId&&c?c.name:null,METHOD_LABEL[l.method],!pay&&Number(l.sessions)?`+${l.sessions} sessions`:null,pay&&l.note?l.note:null].filter(Boolean).join(' · ')}</div>
      <div class="pc-top"><span>${!pay?(owe<=0.004?html`<span class="pill u0">Paid</span>`:html`<${Pill} u=${Math.max(1,urgFromDays(daysBetween(todayYmd(),l.dueDate||l.date)))}>${ch.paid>0?`${money(owe)} left`:'Unpaid'}<//>`):null}</span>
        <span style="display:flex;gap:6px;align-items:center">${!pay&&owe>0.004&&html`<button class="btn sm" onClick=${()=>markPaid(ch)}>Mark paid</button>`}<button class="iconbtn" aria-label="Edit entry" title="Edit" onClick=${()=>setEd(l)}><${Icon} n="edit" s=${15}/></button><${IconDel} onConfirm=${()=>api.del('ledger',l.id)}/></span></div></div>`})
    :html`<div class="empty">No purchases or payments yet.</div>`}</div>${modalEl}`;
  return html`<div class="panel tbl-wrap"><table class="tbl"><thead><tr><th>Date</th>${!clientId&&html`<th>Athlete</th>`}<th>Entry</th><th class="r">Sessions</th><th class="r">Amount</th><th>Status</th><th></th></tr></thead><tbody>
    ${rows.length?rows.map(l=>{const ch=chargeState[l.id];const owe=ch?round2(ch.amount-ch.paid):0;const c=clients[l.clientId];
      return html`<tr><td>${fmtDate(l.date,{month:'short',day:'numeric',year:'2-digit'})}</td>${!clientId&&html`<td>${c?c.name:'—'}</td>`}
        <td>${l.kind==='charge'?html`<b>${l.desc||'Charge'}</b><br/><span class="muted" style="font-size:12.5px">${METHOD_LABEL[l.method]||''}${l.gst?' · incl. GST':''}${Number(l.months)?` · ${l.months} mo from ${fmtDate(l.periodStart,{month:'short',day:'numeric'})}`:''}</span>`:html`<span>Payment received</span><br/><span class="muted" style="font-size:12.5px">${METHOD_LABEL[l.method]||''}${l.note?' · '+l.note:''}</span>`}</td>
        <td class="r num">${l.kind==='charge'&&Number(l.sessions)?'+'+l.sessions:''}</td>
        <td class="r num" style=${l.kind==='payment'?'color:var(--ok)':''}>${l.kind==='payment'?'−':''}${money(l.amount)}</td>
        <td>${l.kind==='charge'?(owe<=0.004?html`<span class="pill u0">Paid</span>`:html`<${Pill} u=${Math.max(1,urgFromDays(daysBetween(todayYmd(),l.dueDate||l.date)))}>${ch.paid>0?`${money(owe)} left`:'Unpaid'}<//>`):''}</td>
        <td class="r" style="white-space:nowrap">${l.kind==='charge'&&owe>0.004&&html`<button class="btn sm" onClick=${()=>markPaid(ch)}>Mark paid</button>`}<button class="iconbtn" aria-label="Edit entry" title="Edit" onClick=${()=>setEd(l)}><${Icon} n="edit" s=${15}/></button><${IconDel} onConfirm=${()=>api.del('ledger',l.id)}/></td></tr>`})
     :html`<tr><td colspan=${clientId?6:7}><div class="empty">No purchases or payments yet.</div></td></tr>`}
  </tbody></table></div>${modalEl}`;
}

function PaymentsPage({ctx,openAthlete}){
  const {clients,derived,settings}=ctx;
  const [modal,setModal]=useState(null);const [showAll,setShowAll]=useState(false);
  const rows=Object.values(clients).filter(c=>showAll||(c.status||'active')==='active').map(c=>({c,s:derived.cs[c.id]||{}}))
    .sort((a,b)=>(b.s.urg-a.s.urg)||((a.s.nextDue||'9')<(b.s.nextDue||'9')?-1:1)||a.c.name.localeCompare(b.c.name));
  const owing=sum(rows,r=>Math.max(0,r.s.balance||0));
  const dueWeek=rows.filter(r=>r.s.urg>=2).length;
  const now=new Date();const fm=finance(derived,clients,settings,now.getFullYear());const M=fm[now.getMonth()];
  const payCards=()=>html`<div class="cardlist">${rows.length?rows.map(({c,s})=>{const p=c.plan||{};return html`<button class="pcard" key=${c.id} onClick=${()=>openAthlete(c.id)}>
    <div class="pc-top"><b>${c.name}</b>${s.active?html`<${Pill} u=${s.urg}>${s.reason}<//>`:html`<span class="pill un">${c.status}</span>`}</div>
    <div class="pc-sub">${[pkgOf(settings,p.packageId)?pkgOf(settings,p.packageId).name:null,p.commitMonths?`${p.commitMonths} mo`:null,`${p.perWeek||'?'}×/wk`,BILLING_LABEL[p.billing],p.rate?`${money(p.rate)}/${p.rateUnit==='month'?'mo':'sess'}`:null,p.rateType&&p.rateType!=='standard'?RATE_TYPE_LABEL[p.rateType]:null,METHOD_LABEL[p.method],p.noGst?'No GST':null].filter(Boolean).join(' · ')}</div>
    <div class="pc-meta"><span><b class="num" style=${s.remaining<=0?'color:var(--r)':''}>${s.remaining}</b> sessions left</span><span>Owes <b class="num" style=${s.balance>0?'color:var(--r)':''}>${money(s.balance)}</b></span><span>${p.billing==='pack'?'Bills per pack':s.termDone?'Term paid':s.nextDue?'Due '+fmtDate(s.nextDue,{month:'short',day:'numeric'}):''}</span></div></button>`})

      <button class="btn" onClick=${()=>setModal('pay')}><${Icon} n="wallet"/>Log payment</button><button class="btn primary" onClick=${()=>setModal('charge')}><${Icon} n="plus"/>Record purchase</button></div>
    <div class="stats">
      <div class="stat"><span class="l">Outstanding</span><span class="v num" style=${owing>0?'color:var(--r)':''}>${money0(owing)}</span><span class="s">across ${rows.filter(r=>r.s.balance>0).length} athletes</span></div>
      <div class="stat"><span class="l">Need attention</span><span class="v num">${dueWeek}</span><span class="s">due this week or overdue</span></div>
      <div class="stat"><span class="l">Collected · ${MONTHS[now.getMonth()]}</span><span class="v num">${money0(M.collected)}</span><span class="s">${money0(M.keep)} yours after GST & tax</span></div>
      <div class="stat"><span class="l">Smoothed paycheck</span><span class="v num">${money0(M.spreadKeep+M.projKeep)}</span><span class="s">this month, take-home</span></div>
    </div>
    <div class="panel tbl-wrap"><div class="panel-h"><h3>Athletes</h3><span class="sp"></span><label class="check" style="font-size:13px"><input type="checkbox" checked=${showAll} onChange=${e=>setShowAll(e.target.checked)}/>Include paused & former</label></div>
      ${ctx.isM?payCards():html`<table class="tbl"><thead><tr><th>Athlete</th><th>Plan</th><th>Rate</th><th class="r">Sessions left</th><th class="r">Balance</th><th>Next due</th><th>Status</th></tr></thead><tbody>
      ${rows.length?rows.map(({c,s})=>{const p=c.plan||{};return html`<tr class="click" onClick=${()=>openAthlete(c.id)}>
        <td><b>${c.name}</b>${c.example?html` <span class="tag ex">Example</span>`:''}<br/><span class="muted" style="font-size:12.5px">${METHOD_LABEL[p.method]||'—'}</span></td>
        <td>${pkgOf(settings,p.packageId)?html`<b>${pkgOf(settings,p.packageId).name}</b><br/>`:''}${p.commitMonths?`${p.commitMonths} mo · `:''}${p.perWeek||'?'}×/wk<br/><span class="muted" style="font-size:12.5px">${BILLING_LABEL[p.billing]||''}</span></td>
        <td class="num">${p.rate?money(p.rate):'—'}<span class="muted">/${p.rateUnit==='month'?'mo':'sess'}</span>${p.noGst?html` <span class="tag">No GST</span>`:''}${p.rateType&&p.rateType!=='standard'?html`<br/><span class="tag">${p.rateType}</span>`:''}</td>
        <td class="r num" style=${s.remaining<=0?'color:var(--r);font-weight:700':''}>${s.remaining}</td>
        <td class="r num" style=${s.balance>0?'color:var(--r);font-weight:700':''}>${money(s.balance)}</td>
        <td>${p.billing==='pack'?html`<span class="muted">When pack runs out</span>`:s.termDone?'Term paid':s.nextDue?fmtDate(s.nextDue):'—'}</td>
